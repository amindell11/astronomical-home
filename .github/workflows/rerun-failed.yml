name: rerun-failed

# A failed hosted run gets one automatic rerun of its failed jobs, so a known flake does not
# hold a PR; the second verdict stands.
on:
  workflow_run:
    workflows: [headless-suite, script-suite]
    types: [completed]

permissions:
  actions: write

jobs:
  rerun:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: gh run rerun "$RUN_ID" --failed --repo "$GITHUB_REPOSITORY"
