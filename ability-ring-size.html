#astro-ring-size-review .astro-countdown {
  position: absolute; top: 4.2%; left: 50%; transform: translateX(-50%);
  display: flex; flex-direction: column; align-items: center; gap: .36em;
  font-size: clamp(16px, 2.2cqw, 30px); line-height: 1.12; font-variant-numeric: tabular-nums;
}
#astro-ring-size-review .astro-phases { display: flex; align-items: center; gap: .22em; height: .22em; }
#astro-ring-size-review .astro-phases i { display: block; width: .58em; height: .12em; background: #e8e8d9; }
#astro-ring-size-review .astro-phases .current { width: 1.05em; height: .22em; }
#astro-ring-size-review .astro-phases .upcoming { opacity: .27; }
#astro-ring-size-review .astro-ability {
  --astro-progress: 180deg; --astro-diameter: 5.42cqw; --astro-ring-width: .23cqw;
  position: absolute; left: 50%; top: 87%; transform: translate(-50%, -50%);
  width: var(--astro-diameter); aspect-ratio: 1; border-radius: 50%; background: rgba(8, 16, 30, .84);
  display: grid; place-items: center;
}
#astro-ring-size-review .astro-larger { --astro-diameter: 7.5cqw; }
#astro-ring-size-review .astro-ring-track, #astro-ring-size-review .astro-ring-fill {
  position: absolute; inset: 0; border-radius: 50%;
  mask: radial-gradient(farthest-side, transparent calc(100% - var(--astro-ring-width)), #000 calc(100% - var(--astro-ring-width) + .3px));
}
#astro-ring-size-review .astro-ring-track { background: rgba(232, 232, 217, .23); }
#astro-ring-size-review .astro-ring-fill { background: conic-gradient(rgba(232, 232, 217, .7) var(--astro-progress), transparent 0); }
#astro-ring-size-review .astro-symbol { width: 48% !important; height: 48% !important; opacity: .63; }
#astro-ring-size-review .astro-ability.astro-ready .astro-symbol { opacity: 1; }
#astro-ring-size-review .astro-ability.astro-ready .astro-ring-fill { background: #e8e8d9; }
</style>
<script>
(() => {
  const root = document.getElementById('astro-ring-size-review');
  const selector = root.querySelector('#astro-ring-sample');
  const state = { progress: 50 };
  const samples = [0, 25, 50, 90, 100];
  function applySaved(saved) {
    const data = saved?.modelContent;
    if (data?.study === 'ability-ring-size' && samples.includes(data.previewReadiness)) state.progress = data.previewReadiness;
  }
  function render() {
    selector.value = String(state.progress);
    root.querySelectorAll('.astro-ability').forEach(indicator => {
      indicator.style.setProperty('--astro-progress', state.progress * 3.6 + 'deg');
      indicator.classList.toggle('astro-ready', state.progress === 100);
      indicator.setAttribute('aria-valuenow', state.progress);
      indicator.setAttribute('aria-valuetext', state.progress === 100 ? 'Ready' : state.progress + ' percent recharged');
    });
  }
  applySaved(window.openai?.widgetState); render();
  selector.addEventListener('change', () => {
    state.progress = Number(selector.value); render();
    window.openai?.setWidgetState({ modelContent: { study: 'ability-ring-size', previewReadiness: state.progress }, privateContent: null }).catch(() => {});
  });
  window.addEventListener('openai:set_globals', event => {
    if (event.detail?.globals?.widgetState) { applySaved(event.detail.globals.widgetState); render(); }
  });
  if (globalThis.Tweak) {
    root.querySelectorAll('.astro-ability').forEach((indicator, index) => {
      const design = { diameter: index === 0 ? 104 : 144 };
      const tweak = new Tweak({ container: indicator, onChange: () => indicator.style.setProperty('--astro-diameter', design.diameter / 19.2 + 'cqw') });
      tweak.addSlider(design, 'diameter', { label: 'Diameter at 1080p', min: 80, max: 180, step: 4, unit: 'px' });
    });
  }
})();
</script>
