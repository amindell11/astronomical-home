<div id="capacity-zoom">
  <div class="viz-controls">
    <label class="form-label">Bar sizing
      <select id="zoom-sizing" class="form-select">
        <option value="world">Scale fully with zoom</option>
        <option value="fixed">Fixed pixel size</option>
        <option value="bounded">Scale with a minimum size</option>
      </select>
    </label>
    <label class="form-label">Capacity cue
      <select id="zoom-cue" class="form-select">
        <option value="graduated">25-unit marks + numbers</option>
        <option value="numeric">Current / maximum</option>
        <option value="absolute">Length represents capacity</option>
      </select>
    </label>
    <label class="form-label">Resources
      <select id="zoom-resources" class="form-select">
        <option value="depleted">Partly depleted</option>
        <option value="full">Full</option>
      </select>
    </label>
  </div>
  <label class="form-label" for="scene-zoom">Zoom <output id="scene-zoom-value" class="tabular-nums">100%</output></label>
  <input id="scene-zoom" class="form-range" type="range" min="50" max="150" step="1" value="100" aria-label="Scene zoom">
  <canvas id="zoom-canvas" width="1280" height="720" role="img" aria-label="Interactive hull and shield size comparison" style="display:block;width:100%;height:auto">Three ships with shield and hull bars. Adjust zoom and bar sizing to compare readability.</canvas>
  <div id="zoom-caption" class="text-small" aria-live="polite">Zoom simulation over a game capture. Blue = shield. Green = hull.</div>
</div>
<script>
(() => {
  const root = document.getElementById('capacity-zoom');
  const canvas = root.querySelector('#zoom-canvas');
  const ctx = canvas.getContext('2d');
  const zoom = root.querySelector('#scene-zoom');
  const sizing = root.querySelector('#zoom-sizing');
  const cue = root.querySelector('#zoom-cue');
  const resources = root.querySelector('#zoom-resources');
  const readout = root.querySelector('#scene-zoom-value');
  const ships = [{"name": "Capacity player", "x": 491.7647, "y": 400.2353, "hullMax": 65, "shieldMax": 32, "hull": 24, "shield": 12}, {"name": "Capacity light enemy", "x": 640, "y": 281.891144, "hullMax": 80, "shieldMax": 50, "hull": 24, "shield": 12}, {"name": "Capacity heavy enemy", "x": 798.823547, "y": 300.378021, "hullMax": 400, "shieldMax": 150, "hull": 200, "shield": 75}];
  const scene = new Image();
  let ready = false;
  const clamp = (value, min, max) => Math.max(min, Math.min(max, value));

  function bar(x, y, maximum, remaining, color, scale) {
    const width = cue.value === 'absolute' ? maximum * .32 : 80;
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scale, scale);
    ctx.fillStyle = '#1a2e3d';
    ctx.fillRect(-40, -4, width, 8);
    ctx.fillStyle = color;
    ctx.fillRect(-40, -4, width * remaining / maximum, 8);
    if (cue.value !== 'numeric') {
      ctx.fillStyle = '#03060b';
      for (let mark = 25; mark < maximum; mark += 25)
        ctx.fillRect(-40 + width * mark / maximum, -4, mark % 100 === 0 ? 2 : 1, 8);
    }
    ctx.font = 'bold 12px Arial, sans-serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.shadowColor = '#000';
    ctx.shadowBlur = 2;
    ctx.shadowOffsetX = 1;
    ctx.shadowOffsetY = 1;
    ctx.fillStyle = '#fff';
    ctx.fillText(Math.ceil(remaining) + '/' + maximum, -40 + width + 5, 0);
    ctx.restore();
  }

  function draw() {
    const factor = Number(zoom.value) / 100;
    const scale = sizing.value === 'fixed' ? 1 : sizing.value === 'bounded' ? clamp(factor, .8, 1.15) : factor;
    readout.value = zoom.value + '%';
    readout.textContent = readout.value;
    zoom.setAttribute('aria-valuetext', readout.value);
    root.dataset.barScale = String(scale);
    root.dataset.zoom = String(factor);
    canvas.setAttribute('aria-label', sizing.selectedOptions[0].text + ', zoom ' + readout.value + ', ' + resources.selectedOptions[0].text.toLowerCase() + '. Blue shield above green hull, with current and maximum numbers.');
    if (!ready) return;
    const sceneScale = 2 * factor;
    ctx.clearRect(0, 0, 1280, 720);
    ctx.drawImage(scene, 640 - 640 * sceneScale, 360 - 360 * sceneScale, 1280 * sceneScale, 720 * sceneScale);
    for (const ship of ships) {
      const x = 640 + (ship.x - 640) * sceneScale;
      const y = 360 + (ship.y - 360) * sceneScale - 12;
      const full = resources.value === 'full';
      bar(x, y - 18 * scale, ship.shieldMax, full ? ship.shieldMax : ship.shield, '#00ccff', scale);
      bar(x, y, ship.hullMax, full ? ship.hullMax : ship.hull, '#38ff26', scale);
    }
  }

  function save() {
    if (window.openai?.setWidgetState) window.openai.setWidgetState({modelContent:{
      comparison:'zoom', sizing:sizing.value, capacityCue:cue.value, resources:resources.value, zoomPercent:Number(zoom.value)
    }}).catch(() => {});
  }

  function restore(saved) {
    const value = saved?.modelContent || {};
    const previousSizing = value.sizing || (['world','fixed','bounded'].includes(value.treatment) ? value.treatment : 'world');
    sizing.value = ['world','fixed','bounded'].includes(previousSizing) ? previousSizing : 'world';
    cue.value = ['numeric','graduated','absolute'].includes(value.capacityCue) ? value.capacityCue : 'graduated';
    resources.value = value.resources === 'full' ? 'full' : 'depleted';
    zoom.value = Number.isFinite(value.zoomPercent) ? clamp(value.zoomPercent,50,150) : 100;
    draw();
  }

  zoom.addEventListener('input', draw);
  zoom.addEventListener('change', save);
  for (const control of [sizing,cue,resources]) control.addEventListener('change',()=>{draw();save();});
  window.addEventListener('openai:set_globals', event=>{
    if(event.detail?.globals?.widgetState) restore(event.detail.globals.widgetState);
  });
  scene.onload=()=>{ready=true;root.dataset.ready='true';draw();};
