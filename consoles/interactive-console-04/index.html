<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Interactive console · B</title><link rel="stylesheet" href="../../combat-hud/shared/type.css"><link rel="stylesheet" href="../../combat-hud/shared/roles.css"><link rel="stylesheet" href="console.css"></head>
<body><main><header><div><h1>Interactive console</h1><p>B · Bilateral instruments</p></div><nav><a href="../interactive-console-05/index.html">Larger detail display</a><a href="../hull-directions-03/index.html">Four screen directions</a><label><input id="effects" type="checkbox" checked> Screen effects</label><button id="native-size" type="button" aria-pressed="false">Native size</button></nav></header>
<div id="scene-wrap"><div id="scene" tabindex="0" aria-label="Interactive hangar console"><img id="base" alt="Physical hangar console and projected Vanguard"><canvas id="main-screen" aria-hidden="true"></canvas><canvas id="detail-screen" aria-hidden="true"></canvas><canvas id="hologram" aria-hidden="true"></canvas><div id="item-controls" role="group" aria-label="Select a console item"><button class="item hull" data-item="hull" aria-label="Vanguard hull" aria-pressed="true"></button><button class="item lasers" data-item="lasers" aria-label="Primary weapon: Lasers" aria-pressed="false"></button><button class="item missiles" data-item="missiles" aria-label="Secondary weapon: Missiles" aria-pressed="false"></button><button class="item dash" data-item="dash" aria-label="Guard Dash, five second cooldown" aria-pressed="false"></button></div><span class="engraved display-label">DISPLAY</span><span class="engraved projection-label">PROJECTION</span><button id="selector" type="button" aria-label="Rotary selector: Vanguard hull. Activate for next item"><canvas id="knob" aria-hidden="true"></canvas><span class="knob-mark" aria-hidden="true"></span></button><button id="previous" class="physical-step" type="button" aria-label="Previous item" aria-keyshortcuts="ArrowLeft ArrowUp"><span aria-hidden="true">‹</span></button><button id="next" class="physical-step" type="button" aria-label="Next item" aria-keyshortcuts="ArrowRight ArrowDown"><span aria-hidden="true">›</span></button><button id="launch" type="button" aria-label="Launch prototype preview"><span>LAUNCH</span></button></div></div>
<footer><p>Hover for details. Click to select. <kbd>←</kbd> <kbd>→</kbd> cycle; <kbd>Enter</kbd> / <kbd>Space</kbd> activate a focused control.</p><p id="status" role="status" aria-live="polite">Vanguard hull selected.</p><p class="prototype-note">Prototype interaction only. Launch gives a local preview response.</p></footer><p id="error" role="alert" hidden></p></main>
