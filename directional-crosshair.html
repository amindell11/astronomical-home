<style>
#directional-crosshair [data-design] { --instrument-ink:#f3f2df; --instrument-track:#172532; --instrument-empty:#607481; --instrument-shadow:#07101d; }
#directional-crosshair canvas { display:block; width:100%; touch-action:none; }
#directional-crosshair [data-scene] { height:240px; cursor:crosshair; }
#directional-crosshair [data-detail] { height:220px; }
</style>
<script>
(() => {
  const root=document.getElementById('directional-crosshair');
  const background=new Image();
  const stateLabel=root.querySelector('[data-state]');
  const release=root.querySelector('[data-release]');
  const saved=window.openai?.widgetState?.modelContent;
  let linger=[0,400].includes(saved?.lingerMs)?saved.lingerMs:400;
  release.value=String(linger);
  let held=0, visible=3, preview=true;
  const inputs=new Map(), timers=new Map();
  const designs=Array.from(root.querySelectorAll('[data-design]')).map(element=>({
    element,weight:3,gap:24,aimX:880,aimY:290,angle:Math.atan2(-50,160)+Math.PI/2
  }));
  const ship={x:720,y:340},cropCentre=800,cropTop=170;
  const rad=degrees=>degrees*Math.PI/180;
  function arc(ctx,radius,start,end,width,color) {
    ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap='butt';
    ctx.beginPath();ctx.arc(0,0,radius,rad(start),rad(end),end<start);ctx.stroke();
  }
  function openTriangle(ctx,halfBase,thickness,ink,shadow) {
    const height=halfBase*Math.sqrt(3);
    const inset=thickness*Math.sqrt(3)/2;
    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.lineTo(halfBase,height);
    ctx.lineTo(halfBase-inset,height+thickness/2);
    ctx.lineTo(0,thickness*2);
    ctx.lineTo(-halfBase+inset,height+thickness/2);
    ctx.lineTo(-halfBase,height);
    ctx.closePath();
    ctx.lineWidth=1;ctx.lineJoin='miter';ctx.strokeStyle=shadow;ctx.stroke();
    ctx.fillStyle=ink;ctx.fill();
  }
  function shape(ctx,design) {
    const style=getComputedStyle(design.element);
    const ink=style.getPropertyValue('--instrument-ink').trim();
    const track=style.getPropertyValue('--instrument-track').trim();
    const empty=style.getPropertyValue('--instrument-empty').trim();
    const shadow=style.getPropertyValue('--instrument-shadow').trim();
    const w=design.weight,g=design.gap;
    const reticleArc=(radius,start,end)=>{
      arc(ctx,radius,start,end,w+1.5,shadow);
      arc(ctx,radius,start,end,w,ink);
    };
    ctx.save();
    if(design.element.dataset.design==='all')ctx.rotate(design.angle);
    ctx.save();
    if(design.element.dataset.design==='triangle')ctx.rotate(design.angle);
    openTriangle(ctx,3,w/2,ink,shadow);
    ctx.restore();
    reticleArc(9,120,215);reticleArc(9,-35,60);
    if(visible&1) {
      arc(ctx,g,120,235,w+1,track);
      arc(ctx,g,120,120+115*.6,w+1,ink);
    }
    if(visible&2) {
      arc(ctx,g,-55,-10,w+1,empty);
      arc(ctx,g,15,60,w+1,ink);
    }
    ctx.restore();
  }
  function canvasContext(canvas,height) {
    const width=canvas.clientWidth;
    if(!width)return null;
    const ratio=window.devicePixelRatio||1;
    canvas.width=Math.round(width*ratio);canvas.height=Math.round(height*ratio);
    const ctx=canvas.getContext('2d');ctx.setTransform(ratio,0,0,ratio,0,0);
    return {ctx,width};
  }
  function renderDesign(design) {
    const scene=canvasContext(design.element.querySelector('[data-scene]'),240);
    if(scene) {
      const {ctx,width}=scene;
      ctx.fillStyle='#081426';ctx.fillRect(0,0,width,240);
      if(background.complete&&background.naturalWidth)ctx.drawImage(background,cropCentre-width/2,cropTop,width,240,0,0,width,240);
      ctx.save();ctx.translate(design.aimX-(cropCentre-width/2),design.aimY-cropTop);shape(ctx,design);ctx.restore();
    }
    const detail=canvasContext(design.element.querySelector('[data-detail]'),220);
    if(detail) {
      const {ctx,width}=detail;
      ctx.fillStyle='#0b1827';ctx.fillRect(0,0,width,220);
      ctx.save();ctx.translate(width/2,108);ctx.scale(4,4);shape(ctx,design);ctx.restore();
    }
  }
  function render() {
    designs.forEach(renderDesign);
    stateLabel.textContent=preview?'Both · shape preview':held?['','Primary held','Secondary held','Both held'][held]:visible?'Released · lingering':'Idle';
    root.querySelectorAll('[data-hold]').forEach(button=>button.setAttribute('aria-pressed',String(!preview&&(held&Number(button.dataset.hold))===Number(button.dataset.hold))));
  }
  function update() {
    if(preview){preview=false;visible=0;}
    const next=Array.from(inputs.values()).reduce((bits,value)=>bits|value,0);
    [1,2].forEach(bit=>{
      if(next&bit){clearTimeout(timers.get(bit));timers.delete(bit);visible|=bit;}
      else if(held&bit){
        clearTimeout(timers.get(bit));
        if(!linger)visible&=~bit;
        else timers.set(bit,setTimeout(()=>{visible&=~bit;timers.delete(bit);render();},linger));
      }
    });
    held=next;render();
  }
  root.querySelectorAll('[data-hold]').forEach(button=>{
    button.addEventListener('pointerdown',event=>{event.preventDefault();button.setPointerCapture(event.pointerId);inputs.set(event.pointerId,Number(button.dataset.hold));update();});
    ['pointerup','pointercancel','lostpointercapture'].forEach(name=>button.addEventListener(name,event=>{inputs.delete(event.pointerId);update();}));
    button.addEventListener('keydown',event=>{if(![' ','Enter'].includes(event.key)||event.repeat)return;event.preventDefault();inputs.set(button,Number(button.dataset.hold));update();});
    button.addEventListener('keyup',event=>{if(![' ','Enter'].includes(event.key))return;event.preventDefault();inputs.delete(button);update();});
    button.addEventListener('blur',()=>{if(inputs.has(button)){inputs.delete(button);update();}});
  });
  release.addEventListener('change',()=>{
    linger=Number(release.value);timers.forEach(clearTimeout);timers.clear();if(!preview)visible=held;render();
    window.openai?.setWidgetState?.({modelContent:{lingerMs:linger}})?.catch(()=>{});
  });
  window.addEventListener('openai:set_globals',event=>{
    const value=event.detail?.globals?.widgetState?.modelContent?.lingerMs;
    if([0,400].includes(value)){linger=value;release.value=String(value);}
  });
  designs.forEach(design=>{
    const scene=design.element.querySelector('[data-scene]');
    scene.addEventListener('pointermove',event=>{
      const bounds=scene.getBoundingClientRect();
      const x=cropCentre-bounds.width/2+event.clientX-bounds.left;
      const y=cropTop+event.clientY-bounds.top;
      designs.forEach(item=>{
        item.aimX=x;item.aimY=y;
        if(Math.hypot(x-ship.x,y-ship.y)>.1)item.angle=Math.atan2(y-ship.y,x-ship.x)+Math.PI/2;
        renderDesign(item);
      });
    });
    new ResizeObserver(()=>renderDesign(design)).observe(design.element);
    if(globalThis.Tweak){
      const tweak=new Tweak({container:design.element,onChange:()=>renderDesign(design)});
      tweak.addSlider(design,'weight',{label:'Stroke weight',min:2,max:4,step:.5,unit:'px'});
      tweak.addSlider(design,'gap',{label:'Readout distance',min:16,max:26,step:1,unit:'px'});
    }
  });
  background.onload=render;
  background.src=JSON.parse(root.querySelector('[data-background]').textContent);
  render();
})();
</script>
