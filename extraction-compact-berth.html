    <button class="btn" type="button" data-show="travel" aria-pressed="false">In flight</button>

<style>
  #compact-berth-review .berth-game { aspect-ratio: 16 / 9; background: #071331; }
  #compact-berth-review .berth-game img { display: block; width: 100%; height: auto; }
  #compact-berth-review .berth-game img[hidden] { display: none; }
  #compact-berth-review .berth-controls { margin-top: 12px; }
  #compact-berth-review .berth-caption { margin-top: 8px; color: var(--muted-foreground); }
  #compact-berth-review .berth-detail { margin-top: 16px; }
  #compact-berth-review .berth-map { width: 200px; height: 200px; overflow: hidden; margin-top: 8px; background: #071331; }
  #compact-berth-review .berth-map img { display: block; width: 1280px; height: 720px; max-width: none; transform: translate(-1048px, -28px); }
</style>
<script>
(() => {
  const root = document.getElementById('compact-berth-review');
  const images = [...root.querySelectorAll('.berth-game img')];
  const buttons = [...root.querySelectorAll('[data-show]')];
  const minimap = root.querySelector('.berth-map img');
  const caption = root.querySelector('.berth-caption');
  function show(state) {
    const selected = images.find(image => image.dataset.state === state);
    if (!selected) return;
    images.forEach(image => { image.hidden = image !== selected; });
    buttons.forEach(button => button.setAttribute('aria-pressed', String(button.dataset.show === state)));
    minimap.src = selected.src;
    caption.textContent = state === 'arrival-wide'
      ? 'Wider station framing · same icon size'
      : 'Game-view prototype · normal camera zoom';
  }
  function restore(saved) {
    show(saved?.privateContent?.state || 'arrival');
  }
  buttons.forEach(button => button.addEventListener('click', () => {
    const state = button.dataset.show;
    show(state);
    if (window.openai?.setWidgetState) {
      window.openai.setWidgetState({modelContent: {concept: 'Compact open berth', viewedState: state}, privateContent: {state}}).catch(() => {});
    }
  }));
  restore(window.openai?.widgetState);
  window.addEventListener('openai:set_globals', event => {
    if (event.detail?.globals?.widgetState) restore(event.detail.globals.widgetState);
  });
})();
</script>
