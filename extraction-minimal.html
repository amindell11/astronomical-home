    <div class="ex-mainmarker" aria-hidden="true">
      <div class="ex-diamond"><i data-lucide="log-out"></i></div><span class="ex-chevron"></span>
    </div>
    <div class="ex-health" aria-hidden="true"></div>
  </div>
  <div class="ex-controls">
    <button type="button" class="cursor-interaction" data-replay>Replay reveal</button>
    <span class="ex-state" aria-live="polite">Icons only</span>
    <span class="ex-note">Visual mockup</span>
  </div>
</div>
<style>
#extraction-minimal-preview { --ex-gold:#ffcc4d; --ex-dark:#07101dfa; --ex-white:#f8f9ff; --ex-cyan:#11cce0; font-family:Arial,sans-serif; color:light-dark(#24262b,#eaedf2); }
#extraction-minimal-preview .ex-game { position:relative; width:100%; aspect-ratio:16/9; overflow:hidden; container-type:inline-size; background:#071331; color:var(--ex-white); }
#extraction-minimal-preview .ex-backdrop { position:absolute; width:100%; height:100%; object-fit:cover; object-position:center; }
#extraction-minimal-preview .ex-stats { position:absolute; top:2.4%; left:50%; transform:translateX(-50%); font-size:2.1cqw; white-space:nowrap; }
#extraction-minimal-preview .ex-ammo { position:absolute; top:1%; left:1.2%; font-size:1cqw; line-height:1.8; }
#extraction-minimal-preview .ex-ammo span { margin-left:9cqw; }
#extraction-minimal-preview .ex-minimap { position:absolute; width:14%; aspect-ratio:1; top:5.5%; right:3.1%; border:2px solid var(--ex-white); border-radius:50%; background:#0c1728c9; overflow:hidden; }
#extraction-minimal-preview .ex-rocks { position:absolute; inset:0; opacity:.9; background:radial-gradient(ellipse at 23% 23%,#a3a6ab 0 4%,transparent 4.5%),radial-gradient(ellipse at 74% 42%,#acafb2 0 5%,transparent 5.5%),radial-gradient(ellipse at 43% 77%,#a3a6ab 0 3%,transparent 3.5%),radial-gradient(ellipse at 80% 76%,#989d9f 0 3%,transparent 3.5%),radial-gradient(ellipse at 20% 66%,#969d9f 0 3%,transparent 3.5%),radial-gradient(ellipse at 53% 18%,#bec2c5 0 2%,transparent 2.5%); }
#extraction-minimal-preview .ex-player { position:absolute; top:48%; left:48%; width:5%; height:5%; border-radius:50%; background:var(--ex-cyan); }
#extraction-minimal-preview .ex-flag { position:absolute; left:50%; top:13.2%; transform:translate(-50%,-50%); width:18%; height:5%; display:flex; align-items:center; justify-content:center; background:var(--ex-dark); color:var(--ex-gold); font-size:1.4cqw; white-space:nowrap; opacity:0; }
#extraction-minimal-preview .ex-mainmarker { position:absolute; left:92.2%; top:37.5%; transform:translate(-50%,-50%); width:2.5%; aspect-ratio:1; color:var(--ex-gold); }

@media(max-width:480px) { #extraction-minimal-preview .ex-flag { font-size:11px; width:40%; height:8%; } #extraction-minimal-preview .ex-stats { font-size:11px; } #extraction-minimal-preview .ex-ammo { display:none; } #extraction-minimal-preview .ex-mainmarker { width:4%; } #extraction-minimal-preview .ex-minimarker { width:3%; } }
</style>
<script>
(() => {
  const root=document.getElementById('extraction-minimal-preview');
  const flag=root.querySelector('.ex-flag');
  const marker=root.querySelector('.ex-mainmarker');
  const arrow=marker.querySelector('.ex-chevron');
  const mini=root.querySelector('.ex-minimarker');
  const label=root.querySelector('.ex-state');
  const button=root.querySelector('[data-replay]');
  const saved=window.openai?.widgetState?.modelContent;
  const options={hold:typeof saved?.holdSeconds==='number'?saved.holdSeconds:1.45};
  let tick=0;
  let started=0;
  const clamp=(v)=>Math.min(1,Math.max(0,v));
  function paint(age) {
    const progress=clamp((age-options.hold)/.6);
    const eased=progress*progress*(3-2*progress);
    const narrow=root.clientWidth<480;
    marker.style.left=((narrow?26:39.3)+(92.2-(narrow?26:39.3))*eased)+'%';
    marker.style.top=(13.2+24.3*eased)+'%';
    arrow.style.opacity=progress>.5?'1':'0';
    flag.style.opacity=String(Math.min(clamp(age/.15),clamp((options.hold+.1-age)/.3)));
    mini.style.transform='translate(-50%,-50%) scale('+(1+.25*Math.max(0,Math.sin(age*7))*clamp(1-age))+')';
  }
  function step(now) {
    const age=(now-started)/1000;
    paint(age);
    if(age<options.hold+.7) tick=requestAnimationFrame(step);
    else { label.textContent='Icons only'; button.disabled=false; }
  }
  function replay() {
    cancelAnimationFrame(tick);
    label.textContent='Extraction opens';
    started=performance.now();
    paint(0);
    tick=requestAnimationFrame(step);
  }
  function persist() {
    window.openai?.setWidgetState?.({modelContent:{holdSeconds:options.hold},privateContent:null}).catch(()=>{});
  }
  button.addEventListener('click',()=>{replay();persist();});
  window.addEventListener('openai:set_globals',(event)=>{
    const next=event.detail?.globals?.widgetState?.modelContent?.holdSeconds;
    if(typeof next==='number') {options.hold=next;paint(20);}
  });
  if(globalThis.Tweak) {
    const tweak=new Tweak({container:root,onChange:()=>{replay();persist();}});
    tweak.addSlider(options,'hold',{label:'Flag duration',min:1,max:3,step:.25,unit:'s'});
  }
  paint(20);
  if(!matchMedia('(prefers-reduced-motion: reduce)').matches) replay();
})();
</script>
