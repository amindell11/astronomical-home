<style>
#extraction-safety-review .ex-captured-view {aspect-ratio:16/9;background:#071331;}
#extraction-safety-review .ex-captured-view img {display:block;width:100%;height:auto;}
#extraction-safety-review .ex-captured-view img[hidden] {display:none;}
#extraction-safety-review .viz-controls {margin-top:12px;}
#extraction-safety-review .ex-caption {margin-top:6px;color:var(--muted-foreground);min-height:20px;}
</style>
<script>
(() => {
  const root=document.getElementById('extraction-safety-review');
  const states=['opening','travel','arrival'];
  function show(section,state) {
    if(!states.includes(state)) state='travel';
    section.querySelectorAll('[data-state]').forEach(img=>{img.hidden=img.dataset.state!==state;});
    section.querySelectorAll('[data-show]').forEach(button=>{button.setAttribute('aria-pressed',String(button.dataset.show===state));});
    section.querySelector('.ex-caption').textContent=state==='arrival'?'Arrival uses a wider camera to show the existing station.':'Game-view prototype';
  }
  function restore(saved) {
    if(!saved?.privateContent?.states) return;
    root.querySelectorAll('[data-concept]').forEach(section=>show(section,saved.privateContent.states[section.dataset.concept]));
  }
  root.querySelectorAll('[data-concept]').forEach(section=>{
    section.querySelectorAll('[data-show]').forEach(button=>button.addEventListener('click',()=>{
      show(section,button.dataset.show);
      const savedStates={};
      root.querySelectorAll('[data-concept]').forEach(s=>{savedStates[s.dataset.concept]=s.querySelector('[aria-pressed="true"]').dataset.show;});
      window.openai?.setWidgetState?.({modelContent:{reviewedConcept:section.dataset.variant,viewedState:button.dataset.show},privateContent:{states:savedStates}}).catch(()=>{});
    }));
  });
  restore(window.openai?.widgetState);
  window.addEventListener('openai:set_globals',event=>restore(event.detail?.globals?.widgetState));
})();
</script>
