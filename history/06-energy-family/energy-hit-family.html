<div id="energy-hit-family">
  <div data-scenes>
    <div class="family-row" data-weapon="laser"><div class="viz-row"><span>Laser · approved</span><span class="text-small text-muted" data-spec="laser"></span></div><div class="family-views"></div></div>
    <div class="family-row" data-weapon="turbo"><div class="viz-row"><span>Turbo laser</span><span class="text-small text-muted" data-spec="turbo"></span></div><div class="family-views"></div></div>
    <div class="family-row" data-weapon="charge"><div class="viz-row"><span>Charge laser</span><span class="text-small text-muted" data-spec="charge"></span></div><div class="family-views"></div></div>
  </div>
  <div class="viz-controls">
    <button type="button" class="btn btn-primary" data-play>Play comparison</button>
    <label class="form-label">Playback<select class="form-select" data-speed><option value="1">Normal speed</option><option value="0.25">Quarter speed</option></select></label>
    <label class="form-label">Turbo contacts<select class="form-select" data-burst><option value="0">Single hit</option><option value="1">Six hits · 75 ms apart</option></select></label>
    <label class="form-label">Charge strength <output data-charge-value>100%</output><input class="form-range" type="range" min="30" max="100" step="1" value="100" data-charge></label>
    <label class="form-label">Time <output data-time-value class="tabular-nums">0 ms</output><input class="form-range" type="range" min="0" max="800" step="1" value="0" data-time></label>
  </div>
  <details><summary>Tune variants</summary><div class="viz-controls">
    <label class="form-label">Turbo duration <output data-value="turbo.durationMs"></output><input class="form-range" data-setting="turbo.durationMs" type="range" min="100" max="240" step="10" value="160"></label>
    <label class="form-label">Turbo width <output data-value="turbo.widthPx"></output><input class="form-range" data-setting="turbo.widthPx" type="range" min="28" max="48" step="2" value="40"></label>
    <label class="form-label">Full-charge duration <output data-value="chargeMax.durationMs"></output><input class="form-range" data-setting="chargeMax.durationMs" type="range" min="340" max="500" step="10" value="420"></label>
    <label class="form-label">Full-charge width <output data-value="chargeMax.widthPx"></output><input class="form-range" data-setting="chargeMax.widthPx" type="range" min="56" max="80" step="2" value="72"></label>
  </div></details>
  <div class="viz-row"><button type="button" class="btn" data-use>Use these variants</button><span class="text-small text-muted" data-status aria-live="polite">Turbo and charge proposals</span></div>
  <details data-export-details><summary>Settings</summary><label class="form-label">Export<textarea class="form-control" data-export readonly rows="6"></textarea></label></details>
</div>
<style>
#energy-hit-family .family-row{margin-bottom:16px}
#energy-hit-family .family-views{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:8px}
#energy-hit-family figure{min-width:0;margin:0}
#energy-hit-family figcaption{margin-bottom:6px}
#energy-hit-family canvas{display:block;width:100%;aspect-ratio:1.4}
#energy-hit-family details{margin:12px 0}
@media(max-width:520px){#energy-hit-family .family-views{grid-template-columns:1fr}#energy-hit-family canvas{aspect-ratio:1.8}}
</style>
<script>
const ImpactMotion = (() => {
  const WORK_SIZE = 320; // Raster size for interactive warping.
  const PALETTE = [[8,104,250],[0,214,250],[184,250,244],[250,252,252]]; // Approved energy bands.
  const BAND_NAMES = ['Blue rim','Cyan','Pale mint','White core'];
  const BODY_END = 0.66; // Body disappears before the last sparks.
  const BAND_END = [0.66,0.60,0.50,0.38]; // Hotter bands vanish first.
  const SPARK_START = 0.10; // Sparks leave after the initial contact flash.
  const SPARK_LENGTH_PX = 6; // Starting spark length at the default display scale.
  const SPARK_WIDTH_PX = 1.4; // Keeps sparks legible without dominating the fan.
  const GLOW_RADIUS_PX = 18; // Glow stays near contact.
  const WARP_CYCLES = 2.5; // Uneven edge motion across one body lifetime.
  const RAY_WINDOWS = [[-1.35,-.70],[-.70,-.23],[-.23,.23],[.23,.78],[.78,1.35]]; // One source-derived ray per lobe.
  const clamp = (x,a=0,b=1) => Math.max(a,Math.min(b,x));
  const smooth = x => {x=clamp(x);return x*x*(3-2*x);};
  const canvas = (w,h=w) => {const c=document.createElement('canvas');c.width=w;c.height=h;return c;};

  function parse(source) {
    const native=canvas(source.naturalWidth,source.naturalHeight),nc=native.getContext('2d',{willReadFrequently:true});
    nc.drawImage(source,0,0);
    const original=nc.getImageData(0,0,native.width,native.height);
    const labels=new Uint8Array(native.width*native.height),counts=[0,0,0,0];
    let minX=native.width,maxX=0,minY=native.height,maxY=0,whiteY=0,whiteWeight=0;
    for(let p=0;p<labels.length;p++) {
      const i=p*4,a=original.data[i+3];if(!a)continue;
      let band=0,best=Infinity;
      PALETTE.forEach((color,b)=>{let distance=0;for(let k=0;k<3;k++)distance+=(original.data[i+k]-color[k])**2;if(distance<best){best=distance;band=b;}});
      labels[p]=band+1;counts[band]++;
      if(a>240){const x=p%native.width,y=Math.floor(p/native.width);minX=Math.min(minX,x);maxX=Math.max(maxX,x);minY=Math.min(minY,y);maxY=Math.max(maxY,y);if(band===3){whiteY+=y;whiteWeight++;}}
    }
    if(!whiteWeight||maxX<=minX)throw Error('The impact source has no usable contact core.');
    const anchor=[minX,whiteY/whiteWeight],bounds=[minX,minY,maxX+1,maxY+1];
    const work=canvas(WORK_SIZE),wc=work.getContext('2d',{willReadFrequently:true});wc.drawImage(source,0,0,WORK_SIZE,WORK_SIZE);
    const pixels=wc.getImageData(0,0,WORK_SIZE,WORK_SIZE),bands=new Uint8Array(WORK_SIZE*WORK_SIZE);
    for(let p=0;p<bands.length;p++)bands[p]=labels[Math.min(native.height-1,Math.floor(p/WORK_SIZE*native.height/WORK_SIZE))*native.width+Math.min(native.width-1,Math.floor((p%WORK_SIZE)*native.width/WORK_SIZE))]-1;
    const rays=RAY_WINDOWS.map(([lo,hi])=>{
      let bestAngle=(lo+hi)/2,bestReach=0;
      for(let angle=lo;angle<=hi;angle+=.012){let reach=0;for(let r=10;r<native.width;r+=3){const x=Math.round(anchor[0]+Math.cos(angle)*r),y=Math.round(anchor[1]+Math.sin(angle)*r);if(x<0||y<0||x>=native.width||y>=native.height)break;if(original.data[(y*native.width+x)*4+3]>240)reach=r;}if(reach>bestReach){bestReach=reach;bestAngle=angle;}}
      return bestAngle;
    });
    return {source,native,original,labels,counts,anchor,bounds,solidWidth:maxX-minX+1,pixels,bands,rays};
  }

  function create(parsed) {
    const frame=canvas(WORK_SIZE),fc=frame.getContext('2d'),output=fc.createImageData(WORK_SIZE,WORK_SIZE);
    const k=WORK_SIZE/parsed.native.width,ax=parsed.anchor[0]*k,ay=parsed.anchor[1]*k,span=parsed.solidWidth*k;
    let cachedKey='';
    function raster(time,settings) {
      if(time===0)return parsed.source;
      const key=[time,settings.durationMs,settings.fanMotion].join('|');if(key===cachedKey)return frame;cachedKey=key;
      output.data.fill(0);
      const u=time/settings.durationMs,q=clamp(u/BODY_END);
      if(time<0||u>=BODY_END){fc.putImageData(output,0,0);return frame;}
      const expansion=Math.sin(Math.PI*q),stretch=1+settings.fanMotion*expansion,spread=1+settings.fanMotion*.75*expansion;
      const src=parsed.pixels.data;
      for(let y=0;y<WORK_SIZE;y++)for(let x=0;x<WORK_SIZE;x++){
        const dx=x-ax,dy=y-ay,sx=ax+dx/stretch;
        const phase=dx/40+q*WARP_CYCLES,tri=2*Math.abs(2*(phase-Math.floor(phase))-1)-1;
        const edge=1+settings.fanMotion*.35*tri*clamp(dx/span)*expansion;
        const sy=ay+dy/(spread*edge);
        if(sx<0||sy<0||sx>=WORK_SIZE-1||sy>=WORK_SIZE-1)continue;
        const ix=Math.floor(sx),iy=Math.floor(sy),fx=sx-ix,fy=sy-iy;
        const locations=[iy*WORK_SIZE+ix,iy*WORK_SIZE+ix+1,(iy+1)*WORK_SIZE+ix,(iy+1)*WORK_SIZE+ix+1];
        const weights=[(1-fx)*(1-fy),fx*(1-fy),(1-fx)*fy,fx*fy];
        let alpha=0,r=0,g=0,b=0;
        for(let n=0;n<4;n++){const p=locations[n],i=p*4,band=parsed.bands[p];if(band>3)continue;const end=BAND_END[band],fade=1-smooth((u-end*.38)/(end*.62));const a=src[i+3]/255*weights[n]*fade;alpha+=a;r+=src[i]*a;g+=src[i+1]*a;b+=src[i+2]*a;}
        if(alpha<=0)continue;const o=(y*WORK_SIZE+x)*4;output.data[o]=r/alpha;output.data[o+1]=g/alpha;output.data[o+2]=b/alpha;output.data[o+3]=alpha*255;
      }
      fc.putImageData(output,0,0);return frame;
    }

    function draw(ctx,time,settings,contact,width=settings.widthPx) {
      const u=time/settings.durationMs;if(time<0||u>=1)return;
      const scale=width/parsed.solidWidth,relative=width/settings.widthPx;
      ctx.save();ctx.translate(contact[0],contact[1]);
      if(time>0&&u<BODY_END&&settings.glow>0){
        const radius=GLOW_RADIUS_PX*relative,alpha=settings.glow*(1-smooth(u/BODY_END));
        const g=ctx.createRadialGradient(1,0,0,1,0,radius);g.addColorStop(0,`rgba(70,185,255,${alpha})`);g.addColorStop(.4,`rgba(8,104,250,${alpha*.4})`);g.addColorStop(1,'rgba(8,104,250,0)');ctx.fillStyle=g;ctx.fillRect(-radius,-radius,radius*2,radius*2);
      }
      if(u<BODY_END){const body=raster(time,settings);ctx.drawImage(body,-parsed.anchor[0]*scale,-parsed.anchor[1]*scale,parsed.native.width*scale,parsed.native.height*scale);}
      if(u>SPARK_START&&settings.sparkReachPx>0){
        const progress=(u-SPARK_START)/(1-SPARK_START),fade=1-smooth(progress),reach=settings.sparkReachPx*relative;
        parsed.rays.forEach((angle,i)=>{
          const distance=(width*.18+reach*(1-(1-progress)**2))*(.82+i*.045);
          const length=SPARK_LENGTH_PX*relative*(1-progress),thickness=SPARK_WIDTH_PX*relative*(1-progress);
          ctx.save();ctx.rotate(angle);ctx.translate(distance,0);ctx.globalAlpha=fade;
          ctx.fillStyle=i%2?'#b8faf4':'#00d6fa';ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(-length,-thickness*.5);ctx.lineTo(-length*.65,0);ctx.lineTo(-length,thickness*.5);ctx.closePath();ctx.fill();ctx.restore();
        });
      }
      ctx.restore();
    }

    function debug(index) {
      const c=canvas(parsed.native.width,parsed.native.height),ctx=c.getContext('2d'),data=ctx.createImageData(c.width,c.height);
      for(let p=0;p<parsed.labels.length;p++){if(parsed.labels[p]!==index+1)continue;for(let channel=0;channel<4;channel++)data.data[p*4+channel]=parsed.original.data[p*4+channel];}
      ctx.putImageData(data,0,0);return c;
    }
    return {draw,raster,debug,parsed};
  }
  return {parse,create,PALETTE,BAND_NAMES,WORK_SIZE};
})();

const fields=[...root.querySelectorAll('[data-setting]')],playButton=root.querySelector('[data-play]'),status=root.querySelector('[data-status]');
const scenes=[];
for(const row of root.querySelectorAll('[data-weapon]'))for(const view of ['large','ship','asteroid']){
 const figure=document.createElement('figure'),caption=document.createElement('figcaption'),canvas=document.createElement('canvas');
 caption.className='text-small';caption.textContent={large:'Enlarged',ship:'Ship · scale preview',asteroid:'Asteroid · scale preview'}[view];
 canvas.setAttribute('role','img');canvas.setAttribute('aria-label',`${row.dataset.weapon} impact, ${caption.textContent}`);figure.append(caption,canvas);row.querySelector('.family-views').append(figure);scenes.push({weapon:row.dataset.weapon,view,canvas,ctx:canvas.getContext('2d')});
}
function charged(c){const u=(c-settings.minCharge)/(1-settings.minCharge);return Object.fromEntries(Object.keys(baseline).map(k=>[k,settings.chargeMin[k]+u*(settings.chargeMax[k]-settings.chargeMin[k])]));}
function preset(weapon){return weapon==='laser'?baseline:weapon==='turbo'?settings.turbo:charged(charge);}
function restore(state){const saved=state?.modelContent?.energyHitSettings;if(saved)for(const f of fields){const [group,key]=f.dataset.setting.split('.'),v=saved[group]?.[key];if(Number.isFinite(v)&&v>=+f.min&&v<=+f.max)settings[group][key]=v;}const ui=state?.privateContent;if(ui){if(ui.speed===1||ui.speed===.25)speed=ui.speed;if(typeof ui.burst==='boolean')burst=ui.burst;if(Number.isFinite(ui.charge)&&ui.charge>=.3&&ui.charge<=1)charge=ui.charge;}}
function save(){window.openai?.setWidgetState?.({modelContent:{energyHitSettings:settings},privateContent:{charge,burst,speed}})?.catch(()=>{});}
function sync(){for(const f of fields){const [group,key]=f.dataset.setting.split('.');f.value=settings[group][key];root.querySelector(`[data-value="${f.dataset.setting}"]`).textContent=f.value+(key==='durationMs'?' ms':' px');}root.querySelector('[data-export]').value=JSON.stringify(settings,null,2);root.querySelector('[data-speed]').value=speed;root.querySelector('[data-burst]').value=burst?'1':'0';root.querySelector('[data-charge]').value=charge*100;root.querySelector('[data-charge-value]').textContent=Math.round(charge*100)+'%';}
function stop(){playing=false;playButton.textContent='Play comparison';}
function render(ms){
 time=ms;root.querySelector('[data-time]').value=Math.max(0,ms);root.querySelector('[data-time-value]').textContent=Math.max(0,Math.round(ms))+' ms';if(!engines)return;
 const theme=getComputedStyle(root),neutral=theme.getPropertyValue('--muted').trim();
 for(const weapon of ['laser','turbo','charge']){const s=preset(weapon);root.querySelector(`[data-spec="${weapon}"]`).textContent=`${Math.round(s.durationMs)} ms · ${Math.round(s.widthPx)} px`+(weapon==='charge'?` · ${Math.round(charge*100)}% charge`:weapon==='turbo'&&burst?' · six hits':'');}
 for(const scene of scenes){const {canvas,ctx:c,view,weapon}=scene,w=canvas.clientWidth,h=canvas.clientHeight,dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,w,h);
  const large=view==='large',contact=large?[w*.12,h*.55]:[w*.46,h*.53],s=preset(weapon),width=large?s.widthPx*Math.min(2.2,w*.76/80):s.widthPx;
  if(large){c.fillStyle=neutral;c.fillRect(0,0,w,h);}else{const center=view==='ship'?[1149,319]:[976,210];c.drawImage(backdrop,center[0]-contact[0],center[1]-contact[1],w,h,0,0,w,h);}
  const count=weapon==='turbo'&&burst?settings.turboHits:1;
  for(let i=0;i<count;i++)engines[weapon].draw(c,ms-i*settings.turboIntervalMs,s,contact,width);
 }
}
function animate(now){if(!playing)return;const ms=(now-start)*speed;render(Math.min(ms,settings.previewEndMs));if(ms>=settings.previewEndMs){stop();status.textContent='Comparison complete';return;}requestAnimationFrame(animate);}
playButton.onclick=()=>{if(playing){stop();return;}playing=true;start=performance.now();playButton.textContent='Pause';status.textContent='Playing comparison';requestAnimationFrame(animate);};
root.querySelector('[data-time]').oninput=e=>{stop();render(+e.target.value);};
root.querySelector('[data-speed]').onchange=e=>{stop();speed=+e.target.value;save();};
root.querySelector('[data-burst]').onchange=e=>{stop();burst=e.target.value==='1';sync();render(burst?100:0);save();};
root.querySelector('[data-charge]').oninput=e=>{stop();charge=+e.target.value/100;sync();render(0);};root.querySelector('[data-charge]').onchange=save;
for(const f of fields){f.oninput=()=>{const [group,key]=f.dataset.setting.split('.');settings[group][key]=+f.value;stop();sync();render(30);};f.onchange=save;}
root.querySelector('[data-use]').onclick=async()=>{save();if(window.openai?.sendFollowUpMessage)await window.openai.sendFollowUpMessage({prompt:'Use these approved turbo and charge laser hit variants: '+JSON.stringify(settings),title:'Use energy hit variants'});else{root.querySelector('[data-export-details]').open=true;root.querySelector('[data-export]').select();status.textContent='Settings selected for copying';}};
restore(window.openai?.widgetState);sync();window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState){restore(e.detail.globals.widgetState);sync();render(time);}});
new ResizeObserver(()=>render(time)).observe(root);
new MutationObserver(()=>render(time)).observe(document.documentElement,{attributes:true,attributeFilter:['class','style','data-theme']});
Promise.all([source.decode(),backdrop.decode()]).then(()=>{const parsed=ImpactMotion.parse(source);engines=Object.fromEntries(['laser','turbo','charge'].map(k=>[k,ImpactMotion.create(parsed)]));render(0);window.energyPreview={ready:true,engines,baseline,get settings(){return structuredClone(settings);},charged,render:ms=>{stop();render(ms);},setView:v=>{stop();if(v.charge!==undefined)charge=v.charge;if(v.burst!==undefined)burst=v.burst;sync();render(0);}};}).catch(e=>{status.setAttribute('role','alert');status.textContent=e.message;throw e;});
})();
