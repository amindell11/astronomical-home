<script>
(async()=>{
 const root=document.getElementById('valis-paint-review');
 const data=JSON.parse(document.getElementById('valis-paint-data').textContent);
 const defaults={...data.settings,palette:'jade-iris',view:'top'};
 let state={...defaults,...(window.openai?.widgetState?.modelContent?.valisPaint||{})};
 const clamp=x=>Math.max(0,Math.min(1,x));
 const lut=Array.from({length:256},(_,i)=>i/255<=.04045?i/255/12.92:((i/255+.055)/1.055)**2.4);
 const srgb=x=>Math.round(255*clamp(x<=.0031308?12.92*x:1.055*Math.pow(Math.max(0,x),1/2.4)-.055));
 const load=src=>new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=reject;im.src=src});
 const pixels=im=>{const c=document.createElement('canvas');c.width=im.width;c.height=im.height;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(im,0,0);return x.getImageData(0,0,c.width,c.height).data};
 const bounds=a=>{let x0=512,y0=512,x1=0,y1=0;for(let y=0;y<512;y++)for(let x=0;x<512;x++)if(a[(y*512+x)*4+3]>128){x0=Math.min(x0,x);y0=Math.min(y0,y);x1=Math.max(x1,x);y1=Math.max(y1,y)}return[x0,y0,x1-x0+1,y1-y0+1]};
 const views={};
 for(const [name,v]of Object.entries(data.views)){
  const [id,mask,ref]=await Promise.all([load(v.id),load(v.mask),load(v.reference)]);
  const ids=pixels(id),m=pixels(mask);views[name]={ids,m,ref,bbox:bounds(ids)};
 }
 const painted=document.createElement('canvas');painted.width=painted.height=512;
 const px=painted.getContext('2d');
 const model=root.querySelector('[data-model]'),reference=root.querySelector('[data-reference]');
 model.width=model.height=reference.width=reference.height=512;
 function draw(){
  if(!views[state.view])state.view='top';if(!data.palettes[state.palette])state.palette='jade-iris';
  const v=views[state.view],im=px.createImageData(512,512),pal=data.palettes[state.palette];
  for(let i=0;i<v.ids.length;i+=4){
   const id=Math.max(0,Math.min(data.materials.length-1,Math.round(lut[v.ids[i]]*8)-1));
   const base=pal[data.materials[id]];
   const sh=lut[v.m[i]]*state.shadow_strength,li=clamp(lut[v.m[i+1]]*state.light_strength),ink=clamp(lut[v.m[i+2]]*state.ink_strength);
   for(let j=0;j<3;j++){const shadowed=base[j]*(1-sh);const lit=shadowed*(1-li)+state.light_color_linear[j]*li;im.data[i+j]=srgb(lit*(1-ink)+state.ink_color_linear[j]*ink)}
   im.data[i+3]=v.ids[i+3];
  }
  px.putImageData(im,0,0);
  const ctx=model.getContext('2d');ctx.clearRect(0,0,512,512);
  const [x,y,w,h]=v.bbox;const scale=460/Math.max(w,h);ctx.drawImage(painted,x,y,w,h,(512-w*scale)/2,(512-h*scale)/2,w*scale,h*scale);
  const rc=reference.getContext('2d');rc.clearRect(0,0,512,512);const rs=460/Math.max(v.ref.width,v.ref.height);rc.drawImage(v.ref,(512-v.ref.width*rs)/2,(512-v.ref.height*rs)/2,v.ref.width*rs,v.ref.height*rs);
  for(const c of root.querySelectorAll('[data-scale]')){
   const size=+c.dataset.scale;c.width=Math.ceil(size*(v.ref.width/v.ref.height+w/h)+28);c.height=size+8;
   const dc=c.getContext('2d');const rw=size*v.ref.width/v.ref.height;dc.drawImage(v.ref,0,4,rw,size);dc.drawImage(painted,x,y,w,h,rw+28,4,size*w/h,size);
  }
  for(const el of root.querySelectorAll('[data-knob]')){el.value=state[el.dataset.knob];root.querySelector(`[data-value="${el.dataset.knob}"]`).textContent=(+el.value).toFixed(2)}
  root.querySelector('[data-view]').value=state.view;root.querySelector('[data-palette]').value=state.palette;
  root.querySelector('[data-settings]').value=JSON.stringify({...data.settings,shadow_strength:state.shadow_strength,light_strength:state.light_strength,ink_strength:state.ink_strength,palette:state.palette},null,2);
 }
 function save(){window.openai?.setWidgetState?.({modelContent:{valisPaint:state},privateContent:null})?.catch(()=>{})}
 for(const el of root.querySelectorAll('[data-knob]'))el.addEventListener('input',()=>{state[el.dataset.knob]=+el.value;draw();save()});
 root.querySelector('[data-view]').addEventListener('change',e=>{state.view=e.target.value;draw();save()});
 root.querySelector('[data-palette]').addEventListener('change',e=>{state.palette=e.target.value;draw();save()});
 root.querySelector('[data-reset]').addEventListener('click',()=>{state={...defaults};draw();save()});
 root.querySelector('[data-export]').addEventListener('click',()=>{const ta=root.querySelector('[data-settings]');ta.hidden=false;ta.select();root.querySelector('[data-status]').textContent='Paint settings ready';save()});
 window.addEventListener('openai:set_globals',e=>{const next=e.detail?.globals?.widgetState?.modelContent?.valisPaint;if(next){state={...defaults,...next};draw()}});
 draw();root.dataset.ready='true';
})().catch(error=>{const r=document.getElementById('valis-paint-review');const s=r.querySelector('[data-status]');s.className='text-destructive';s.textContent=error.message;s.setAttribute('role','alert')});
</script>
