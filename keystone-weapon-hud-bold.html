<style>
#keystone-weapon-hud { color:#f3f2df; }
#keystone-weapon-hud .ks-screen { background:#08152d; }
#keystone-weapon-hud .ks-scene { display:block; width:100%; height:auto; }
#keystone-weapon-hud .ks-detail-row { background:#0b1426; display:flex; justify-content:center; margin-top:12px; }
#keystone-weapon-hud .ks-detail { display:block; width:560px; max-width:100%; height:auto; }
@media (max-width:560px) { #keystone-weapon-hud .ks-detail text { font-size:20px; letter-spacing:0; } }
</style>
<script>
(() => {
  const root = document.getElementById('keystone-weapon-hud');
  const state = { primary:64, secondary:39, spacing:24, thickness:10 };
  const groups = [root.querySelector('[data-game-arcs]'), root.querySelector('[data-detail-arcs]')];
  const radians = value => value * Math.PI / 180;
  function arc(radius, start, end) {
    const point = angle => [radius*Math.cos(radians(angle)), radius*Math.sin(radians(angle))];
    const a=point(start), b=point(end);
    return `M ${a[0]} ${a[1]} A ${radius} ${radius} 0 0 1 ${b[0]} ${b[1]}`;
  }
  function render() {
    const radius = 52 + state.spacing;
    const marks = [[120,240,state.primary],[-60,60,state.secondary]].map(([start,end,fill]) => {
      const track = `<path d="${arc(radius,start,end)}" stroke="#a3a6aa" stroke-opacity=".3"/>`;
      const value = fill > 0 ? `<path d="${arc(radius,start,start+(end-start)*fill/100)}" stroke="#f3f2df"/>` : '';
      return track+value;
    }).join('');
    groups.forEach(group => group.innerHTML = `<g fill="none" stroke-width="${state.thickness}" stroke-linecap="butt">${marks}</g>`);
  }
  render();
  if (globalThis.Tweak) {
    const tweak = new Tweak({container:root.querySelector('.ks-screen'),onChange:render});
    tweak.addSlider(state,'primary',{label:'Primary cooldown',min:0,max:100,step:1,unit:'%'});
    tweak.addSlider(state,'secondary',{label:'Secondary cooldown',min:0,max:100,step:1,unit:'%'});
    tweak.addSlider(state,'spacing',{label:'Gap from Keystone',min:10,max:24,step:1,unit:'px'});
    tweak.addSlider(state,'thickness',{label:'Weapon arc thickness',min:3,max:14,step:.5,unit:'px'});
  }
})();
</script>
