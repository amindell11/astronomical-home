<style>
#left-facing-trophies .hr-controls { margin-bottom:12px; }
#left-facing-trophies .hr-game { --hr-ink:#edf0ec; --hr-soft:#b2bdcf; --hr-line:#d6dfed40; --hr-paint:#e8e7d9; position:relative; isolation:isolate; height:606px; overflow:hidden; background:#061027; color:var(--hr-ink); color-scheme:dark; font:400 14px/1.4 Bahnschrift,"Arial Narrow","Segoe UI",sans-serif; }
#left-facing-trophies .hr-game *, #left-facing-trophies .hr-game *::before, #left-facing-trophies .hr-game *::after { box-sizing:border-box; }
#left-facing-trophies .hr-space { position:absolute; z-index:-2; inset:0; overflow:hidden; background:radial-gradient(ellipse at 91% 72%,#3c3e8177,transparent 40%),radial-gradient(ellipse at 17% 30%,#2e79a45e,transparent 28%),linear-gradient(149deg,#061025 18%,#102348 40%,#266984 44%,#162d59 49%,#080f2b 66%,#1c2859); }
#left-facing-trophies .hr-star { position:absolute; border-radius:50%; background:#ecf1f6; }
#left-facing-trophies .hr-rock { position:absolute; background:linear-gradient(130deg,#c2bca0 0 28%,#79766d 29% 46%,#4b4e60 47% 71%,#30394c 72%); clip-path:polygon(5% 33%,20% 10%,49% 0,72% 9%,94% 35%,100% 69%,76% 92%,41% 100%,12% 79%,0 57%); }
#left-facing-trophies .hr-rock.a { width:112px; height:139px; right:4%; top:3%; transform:rotate(22deg); }
#left-facing-trophies .hr-rock.b { width:84px; height:70px; left:26%; bottom:7%; transform:rotate(-38deg); }
#left-facing-trophies .hr-rock.c { width:51px; height:72px; right:17%; bottom:25%; transform:rotate(19deg); }
#left-facing-trophies .hr-scene-ship { position:absolute; width:48px; height:48px; left:72%; top:36%; transform:rotate(43deg); opacity:.65; background:#a5b7d3; mask-size:contain; mask-position:center; mask-repeat:no-repeat; }
#left-facing-trophies .hr-panel { --hr-opacity:.9; position:absolute; left:7%; top:50%; transform:translateY(-50%); width:338px; padding:27px 28px; background:rgba(12,20,39,var(--hr-opacity)); }
#left-facing-trophies .hr-panel::before { content:""; position:absolute; top:0; left:0; width:17px; height:17px; border:solid #e9edf16e; border-width:1px 0 0 1px; }
#left-facing-trophies .hr-outcome { font:400 40px/1.1 Bahnschrift,"Arial Narrow","Segoe UI",sans-serif; letter-spacing:1.8px; margin:0 0 29px; white-space:nowrap; color:var(--hr-ink); }
#left-facing-trophies .hr-tally-label { display:flex; align-items:baseline; gap:9px; color:var(--hr-soft); font-size:11px; line-height:20px; letter-spacing:1.7px; margin-bottom:12px; }
#left-facing-trophies .hr-count { color:var(--hr-ink); font-size:17px; letter-spacing:.5px; }
#left-facing-trophies .hr-trophies { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:6px 8px; }
#left-facing-trophies .hr-mark { position:relative; display:grid; place-items:center; height:40px; min-width:0; border:0; padding:0; background:transparent; color:var(--hr-paint); }
#left-facing-trophies .hr-mark::before { content:""; width:34px; height:34px; background:currentColor; transform:rotate(var(--hr-tilt,-45deg)); mask-image:var(--hr-ship); mask-size:contain; mask-position:center; mask-repeat:no-repeat; }
#left-facing-trophies .hr-mark:hover { color:#fff; }
#left-facing-trophies .hr-mark[aria-pressed="true"] { background:#bbc8df13; }
#left-facing-trophies .hr-detail { height:17px; margin-top:8px; color:var(--hr-soft); font-size:11px; line-height:17px; letter-spacing:.8px; }
#left-facing-trophies .hr-progress { border-top:1px solid var(--hr-line); padding-top:18px; margin-top:11px; }
#left-facing-trophies .hr-distance { color:var(--hr-soft); font-size:11px; letter-spacing:1.4px; line-height:16px; margin-bottom:13px; }
#left-facing-trophies .hr-route { display:flex; align-items:center; gap:10px; }
#left-facing-trophies .hr-node { position:relative; display:grid; place-items:center; width:26px; height:26px; flex-shrink:0; font-size:11px; letter-spacing:.5px; }
#left-facing-trophies .hr-node::before { content:""; position:absolute; inset:0; border-radius:50%; background:#a7bbcf20; }
#left-facing-trophies .hr-node.hr-reached { color:#edba9d; }
#left-facing-trophies .hr-node.hr-reached::before { border:1px solid #e2b69588; border-top-color:transparent; background:none; transform:rotate(-30deg); }
#left-facing-trophies .hr-path { flex:1; height:1px; background:#c4d1e64a; }
#left-facing-trophies .hr-continue { display:flex; align-items:center; gap:29px; margin-top:24px; padding:10px 16px; min-height:38px; border:1px solid #e4e8ec80; color:var(--hr-ink); background:transparent; font:400 11px/1.2 Bahnschrift,"Arial Narrow","Segoe UI",sans-serif; letter-spacing:2px; }
#left-facing-trophies .hr-continue span { font-size:18px; line-height:12px; }
#left-facing-trophies .hr-continue:hover { background:#d8e1f111; border-color:#edf0ec; }
@media(max-width:560px) {
 #left-facing-trophies .hr-game { height:606px; }
 #left-facing-trophies .hr-panel { left:50%; width:calc(100% - 32px); max-width:338px; padding:26px 22px; transform:translate(-50%,-50%); }
 #left-facing-trophies .hr-outcome { font-size:35px; letter-spacing:1.2px; }
 #left-facing-trophies .hr-trophies { gap:5px 2px; }
 #left-facing-trophies .hr-mark { height:44px; }
 #left-facing-trophies .hr-continue { min-height:44px; }
}
</style>
<div id="left-facing-trophies">
 <div class="hr-controls">
  <div class="viz-row" role="group" aria-label="Preview outcome">
   <button class="btn" type="button" data-outcome="loss" aria-pressed="true">Ship lost</button>
   <button class="btn" type="button" data-outcome="win" aria-pressed="false">Extracted</button>
  </div>
 </div>
 <div aria-label="Left-facing ship trophies">
  <section aria-label="Left-facing tally">

    <div class="hr-space" aria-hidden="true"></div>

     <div class="hr-progress"><div class="hr-distance">2 SECTORS CLEARED</div><div class="hr-route"></div></div>
     <button class="hr-continue cursor-interaction" type="button">CONTINUE <span aria-hidden="true">›</span></button>
    </div>
   </div>
  </section>
 </div>
</div>

<script>
(() => {
 const root=document.getElementById('left-facing-trophies');
 const textures=JSON.parse(document.getElementById('left-facing-trophy-assets').textContent);
 const kills=['Valis','Crimson','Valis','Nightshade','Vanguard','Crimson','Valis','Bulwark','Nightshade','Valis','Vanguard','Crimson','Nightshade','Bulwark','Valis','Crimson','Vanguard'];
 const saved=window.openai?.widgetState?.modelContent;
 let outcome=saved?.outcome==='win'?'win':'loss';
 let selected=Number.isInteger(saved?.selected)&&saved.selected>=0&&saved.selected<kills.length?saved.selected:-1;
 function persist(){window.openai?.setWidgetState?.({modelContent:{outcome,selected,selectedShip:kills[selected]??null},privateContent:null})?.catch?.(()=>{});}
 function render(){
  root.querySelectorAll('[data-outcome]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.outcome===outcome)));
  root.querySelectorAll('.hr-game').forEach(game=>{
   game.querySelector('.hr-outcome').textContent=outcome==='win'?'EXTRACTED':'SHIP LOST';
   game.querySelector('.hr-distance').textContent=outcome==='win'?'3 SECTORS CLEARED':'2 SECTORS CLEARED';
   game.querySelectorAll('.hr-node').forEach((node,index)=>{
    const cleared=index<2||outcome==='win';
    node.classList.toggle('hr-reached',!cleared);
    node.setAttribute('aria-label',`Sector ${index+1}, ${cleared?'cleared':'reached'}`);
   });
   game.querySelector('.hr-detail').textContent=selected>=0?`${kills[selected]} destroyed`:'';
   game.querySelectorAll('.hr-mark').forEach((mark,index)=>mark.setAttribute('aria-pressed',String(index===selected)));
  });
 }
 root.querySelectorAll('.hr-game').forEach(game=>{
  const space=game.querySelector('.hr-space');
  for(let i=0;i<95;i++){
   const star=document.createElement('i');star.className='hr-star';star.style.cssText=`left:${(i*67.31)%100}%;top:${(i*43.77)%100}%;width:${i%13===0?2:1}px;height:${i%13===0?2:1}px;opacity:${.2+(i%5)*.13}`;space.append(star);
  }
  ['a','b','c'].forEach(name=>{const rock=document.createElement('i');rock.className=`hr-rock ${name}`;space.append(rock);});
  const sceneShip=document.createElement('i');sceneShip.className='hr-scene-ship';sceneShip.style.maskImage=`url("${textures.Valis}")`;space.append(sceneShip);
  const grid=game.querySelector('.hr-trophies');
  kills.forEach((name,index)=>{
   const mark=document.createElement('button');mark.type='button';mark.className='hr-mark cursor-interaction';mark.setAttribute('aria-label',`${name} destroyed, kill ${index+1}`);mark.style.setProperty('--hr-ship',`url("${textures[name]}")`);mark.addEventListener('click',()=>{selected=selected===index?-1:index;render();persist();});grid.append(mark);
  });
  const route=game.querySelector('.hr-route');
  ['01','02','03'].forEach((num,index)=>{
   if(index){const path=document.createElement('span');path.className='hr-path';path.setAttribute('aria-hidden','true');route.append(path);}
   const node=document.createElement('span');node.className='hr-node';node.textContent=num;route.append(node);
  });
  game.querySelector('.hr-continue').addEventListener('click',()=>game.querySelector('.hr-detail').textContent='Returns to the hangar');
  if(globalThis.Tweak){
   const panel=game.querySelector('.hr-panel');const state={backing:90,tilt:-45};
   const tweak=new Tweak({container:panel,onChange:()=>{panel.style.setProperty('--hr-opacity',String(state.backing/100));panel.style.setProperty('--hr-tilt',state.tilt+'deg');}});
   tweak.addSlider(state,'backing',{label:'Backing opacity',min:55,max:100,step:1,unit:'%'});
   tweak.addSlider(state,'tilt',{label:'Ship tilt',min:-90,max:0,step:5,unit:'°'});
  }
 });
 root.querySelectorAll('[data-outcome]').forEach(button=>button.addEventListener('click',()=>{outcome=button.dataset.outcome;render();persist();}));
 window.addEventListener('openai:set_globals',event=>{
  const state=event.detail?.globals?.widgetState?.modelContent;if(!state)return;
  outcome=state.outcome==='win'?'win':'loss';selected=Number.isInteger(state.selected)&&state.selected>=0&&state.selected<kills.length?state.selected:-1;render();
 });
 render();
})();
</script>
