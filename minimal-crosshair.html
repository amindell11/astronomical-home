<script>
(() => {
  const root = document.getElementById('crosshair-study');
  const images = JSON.parse(root.querySelector('[data-images]').textContent);
  const full = root.querySelector('[data-full]');
  const close = root.querySelector('[data-close]');
  const label = root.querySelector('[data-state]');
  const release = root.querySelector('[data-release]');
  const names = ['Idle', 'Primary held', 'Secondary held', 'Both held'];
  const inputs = new Map();
  const timers = new Map();
  let visible = 0;
  let held = 0;
  let linger = Number(window.openai?.widgetState?.modelContent?.lingerMs) || 0;
  release.value = String(linger);
  images.forEach(src => { const image = new Image(); image.src = src; });
  function render() {
    full.src = images[visible];
    close.src = images[visible];
    label.textContent = held ? names[held] : visible ? 'Released · lingering' : 'Idle';
    root.querySelectorAll('[data-hold]').forEach(button => {
      button.setAttribute('aria-pressed', String((held & Number(button.dataset.hold)) === Number(button.dataset.hold)));
    });
  }
  function update() {
    const next = Array.from(inputs.values()).reduce((bits, value) => bits | value, 0);
    [1, 2].forEach(bit => {
      if (next & bit) {
        clearTimeout(timers.get(bit));
        timers.delete(bit);
        visible |= bit;
      } else if (held & bit) {
        clearTimeout(timers.get(bit));
        if (!linger) visible &= ~bit;
        else timers.set(bit, setTimeout(() => { visible &= ~bit; timers.delete(bit); render(); }, linger));
      }
    });
    held = next;
    render();
  }
  root.querySelectorAll('[data-hold]').forEach(button => {
    button.addEventListener('pointerdown', event => {
      event.preventDefault();
      button.setPointerCapture(event.pointerId);
      inputs.set(event.pointerId, Number(button.dataset.hold));
      update();
    });
    ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(name => button.addEventListener(name, event => {
      inputs.delete(event.pointerId);
      update();
    }));
    button.addEventListener('keydown', event => {
      if (![' ', 'Enter'].includes(event.key) || event.repeat) return;
      event.preventDefault(); inputs.set(button, Number(button.dataset.hold)); update();
    });
    button.addEventListener('keyup', event => {
      if (![' ', 'Enter'].includes(event.key)) return;
      event.preventDefault(); inputs.delete(button); update();
    });
    button.addEventListener('blur', () => { inputs.delete(button); update(); });
  });
  release.addEventListener('change', () => {
    linger = Number(release.value);
    timers.forEach(clearTimeout); timers.clear(); visible = held; render();
    window.openai?.setWidgetState?.({modelContent:{lingerMs:linger}})?.catch(() => {});
  });
  render();
})();
</script>
