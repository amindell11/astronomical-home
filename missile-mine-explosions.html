<div id="weapon-explosion-study">
  <div class="viz-controls">
    <button class="btn btn-primary" type="button" id="blast-play">Play all</button>
    <label class="form-check"><input class="form-check-input" id="blast-slow" type="checkbox"><span class="form-check-label">Slow motion</span></label>
    <label class="form-label" for="blast-time">After detonation <output id="blast-clock" class="tabular-nums">120 ms</output><input class="form-range" id="blast-time" type="range" min="0" max="1100" step="5" value="120"></label>
  </div>
  <div class="viz-grid blast-grid">
    <section class="mine-study"><h3>Mine · seismic disc</h3><canvas data-effect="seismic" role="img" aria-label="Blue-white core snapping into a broad translucent blue pressure disc over the original 0.8 second sweep. Large oblique view and smaller overhead view show the same motion."></canvas><div class="text-small">Blue-white flash · broad energy sheet · 0.8 s sweep</div></section>
    <section><h3>Missile · compact burst</h3><canvas data-effect="compact" role="img" aria-label="Compact warm missile burst at its original speed, enlarged and in a 96 pixel box."></canvas><div class="text-small">Fire breaks by 310 ms · residual sparks and smoke clear by 580 ms</div></section>
  </div>
  <div class="text-small text-muted" id="blast-status" aria-live="polite">Approved rough shapes · original timing · camera angles and scale are illustrative</div>
</div>
<style>
#weapon-explosion-study .blast-grid{gap:20px;grid-template-columns:minmax(0,1fr);margin:12px 0}
#weapon-explosion-study section{min-width:0}
#weapon-explosion-study h3{margin:0 0 8px}
#weapon-explosion-study canvas{display:block;width:100%;height:180px;margin-bottom:8px}
#weapon-explosion-study .mine-study canvas{height:270px}
@media(max-width:480px){#weapon-explosion-study .mine-study canvas{height:330px}}
</style>
<script>
(()=>{
  const root=document.getElementById('weapon-explosion-study');
  const canvases=[...root.querySelectorAll('canvas')];
  const slider=root.querySelector('#blast-time'),clock=root.querySelector('#blast-clock');
  const play=root.querySelector('#blast-play'),slow=root.querySelector('#blast-slow');
  const status=root.querySelector('#blast-status');
  const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const TAU=Math.PI*2,clamp=(n)=>Math.max(0,Math.min(1,n));
  const rand=(i)=>{const r=Math.sin(i*127.1+311.7)*43758.5453;return r-Math.floor(r)};
  let time=.12,frame=0,start=0,playing=false;
  const palette={ink:'#252b39',smoke:'#404a5d',smokeLight:'#747d8a',red:'#ea4818',orange:'#ff791b',gold:'#ffc849',cream:'#fff2aa',white:'#fffbe5',blue:'#4b99c6',ice:'#b8edf3'};
  function shape(ctx,pts,color){ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.fillStyle=color;ctx.fill()}
  function burst(ctx,r,seed,sx=1,sy=1){
    const pts=[];
    for(let i=0;i<28;i++){
      const a=(i+.28*(rand(i+seed+4)-.5))/28*TAU,rr=r*(i%2?.43+rand(i+seed)*.32:.63+rand(i+seed)*.37);
      pts.push([Math.cos(a)*rr*sx,Math.sin(a)*rr*sy]);
    }
    return pts;
  }
  function scaled(pts,s,dx=0,dy=0){return pts.map(p=>[p[0]*s+dx,p[1]*s+dy])}
  function shard(ctx,x,y,a,len,width,color){
    ctx.save();ctx.translate(x,y);ctx.rotate(a);
    shape(ctx,[[-len*.45,0],[-len*.22,-width*.55],[len*.48,-width*.13],[len*.67,0],[len*.1,width*.45],[-len*.27,width*.28]],color);
    shape(ctx,[[-len*.15,0],[len*.45,-width*.05],[len*.1,width*.19]],palette.cream);
    ctx.restore();
  }
  function smoke(ctx,t,amount){
    if(t<.07||t>.58)return;
    const u=clamp((t-.07)/.5),alpha=(1-u)*.75;
    for(let i=0;i<amount;i++){
      const a=i/amount*TAU+.6,dist=14+u*35,r=(12+rand(i+20)*7)*(1-u*.4);
      ctx.save();ctx.translate(Math.cos(a)*dist,Math.sin(a)*dist);ctx.rotate(a);ctx.globalAlpha=alpha;
      ctx.fillStyle=palette.ink;ctx.beginPath();ctx.ellipse(0,0,r,r*.7,0,0,TAU);ctx.fill();
      ctx.fillStyle=palette.smoke;ctx.beginPath();ctx.ellipse(-r*.12,-r*.19,r*.8,r*.55,-.5,0,TAU);ctx.fill();
      ctx.fillStyle=palette.smokeLight;ctx.beginPath();ctx.ellipse(-r*.29,-r*.35,r*.4,r*.15,-.5,0,TAU);ctx.fill();ctx.restore();
    }
  }
  function missile(ctx,t,directional){
    smoke(ctx,t,3);
    const snap=Math.floor(t*24)/24;
    if(t<.31){
      const growth=clamp(t/.075),decay=clamp((t-.08)/.23),r=(5+47*Math.pow(growth,.6))*(1-decay*.35);
      const pts=burst(ctx,r,23+Math.floor(snap*10),directional?1.16:1,directional?.86:1);
      ctx.save();
      if(decay>.43){
        const split=clamp((decay-.43)/.57);
        for(let i=0;i<5;i++){
          const a=i/5*TAU+.23,dist=12+split*25,sz=(19+rand(i)*8)*(1-split);
          ctx.save();ctx.translate(Math.cos(a)*dist,Math.sin(a)*dist);
          const p=burst(ctx,sz,i+15);shape(ctx,p,palette.red);shape(ctx,scaled(p,.72),palette.orange);shape(ctx,scaled(p,.42),palette.gold);ctx.restore();
        }
      }else{
        shape(ctx,pts,palette.red);shape(ctx,scaled(pts,.83,-2,0),palette.orange);shape(ctx,scaled(pts,.59,-3,0),palette.gold);
        shape(ctx,scaled(pts,t<.065?.52:.32,-3,0),palette.cream);
        if(t<.1)shape(ctx,scaled(pts,.18,-3,0),palette.white);
      }
      ctx.restore();
    }
    for(let i=0;i<7;i++){
      const delay=rand(i+8)*.035,u=t-delay,life=.25+rand(i+12)*.25;
      if(u<0||u>life)continue;
      const a=directional?(i<4?-.5+i*.32:i/7*TAU):i/7*TAU+rand(i+5)*.28;
      const distance=8+(50+rand(i+3)*45)*Math.pow(clamp(u/.4),.7),k=1-u/life;
      shard(ctx,Math.cos(a)*distance,Math.sin(a)*distance,a,(directional&&i<4?28:16)*k+2,5*k+1,i%2?palette.gold:palette.orange);
    }
  }
  function wavePath(ctx,r,inner=0){
    ctx.beginPath();
    for(let i=0;i<=128;i++){
      const a=i/128*TAU,rough=1+.006*Math.sin(a*11)+.004*Math.sin(a*19+.7);
      const x=Math.cos(a)*r*rough,y=Math.sin(a)*r*rough;
      i?ctx.lineTo(x,y):ctx.moveTo(x,y);
    }
    if(inner>0){for(let i=128;i>=0;i--){const a=i/128*TAU,rr=inner*(1+.035*Math.sin(a*5+1)+.018*Math.cos(a*13));ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr)}}
    ctx.closePath();
  }
  function seismic(ctx,t,pitch){
    if(t<0||t>.92)return;
    const r=104*clamp(t/.8),fade=1-clamp((t-.8)/.12);
    ctx.save();ctx.rotate(-.10);ctx.scale(1,pitch);ctx.globalAlpha=fade;
    if(r>1){
      const wash=ctx.createRadialGradient(0,0,0,0,0,r);
      wash.addColorStop(0,'rgba(30,109,190,0.24)');wash.addColorStop(.35,'rgba(36,137,210,0.27)');
      wash.addColorStop(.67,'rgba(31,151,214,0.27)');wash.addColorStop(.9,'rgba(63,194,239,0.31)');wash.addColorStop(1,'rgba(138,239,255,0.10)');
      wavePath(ctx,r);ctx.fillStyle=wash;ctx.fill();
      wavePath(ctx,r*.96,r*.83);ctx.fillStyle='rgba(49,148,222,0.10)';ctx.fill();
      shape(ctx,[[-r*.83,-r*.20],[-r*.3,-r*.26],[r*.63,-r*.1],[r*.91,r*.15],[r*.22,r*.02],[-r*.5,-r*.03]],'rgba(66,174,221,0.14)');
      shape(ctx,[[-r*.7,r*.5],[-r*.1,r*.16],[r*.75,r*.37],[r*.4,r*.45],[-r*.13,r*.34]],'rgba(71,183,224,0.12)');
      for(let j=0;j<5;j++){
        const a=rand(j+41)*TAU,span=.23+rand(j+12)*.34;
        ctx.beginPath();
        for(let k=0;k<=20;k++){const theta=a+k/20*span,rr=r*(.62+k/20*.23+.025*Math.sin(k*.5+j));const x=Math.cos(theta)*rr,y=Math.sin(theta)*rr;k?ctx.lineTo(x,y):ctx.moveTo(x,y)}
        ctx.strokeStyle='rgba(109,213,248,0.25)';ctx.lineWidth=1.2;ctx.stroke();
      }
      if(t<.8){
        ctx.shadowBlur=7;ctx.shadowColor='#34b7ff';wavePath(ctx,r);ctx.strokeStyle='rgba(53,174,255,0.5)';ctx.lineWidth=3;ctx.stroke();
        ctx.shadowBlur=0;wavePath(ctx,r);ctx.strokeStyle='#8edbf5';ctx.lineWidth=.85;ctx.stroke();
        ctx.beginPath();ctx.ellipse(0,0,r,r,0,.05,Math.PI-.05);ctx.strokeStyle='#d0f7ff';ctx.lineWidth=1.2;ctx.stroke();
      }
    }
    ctx.restore();
    if(t<.14){
      const u=clamp(t/.14),coreRadius=3+21*Math.pow(Math.sin(Math.PI*u),1.1),energy=1-clamp((t-.055)/.085);
      ctx.save();ctx.globalAlpha=energy;ctx.shadowBlur=12;ctx.shadowColor='#2698ff';
      const pts=burst(ctx,coreRadius,30,1,.85);shape(ctx,pts,'#164a9a');shape(ctx,scaled(pts,.8),'#238fd5');shape(ctx,scaled(pts,.56),'#5bd8f0');shape(ctx,scaled(pts,.32),'#e4ffff');ctx.shadowBlur=0;
      if(t<.095)for(const sign of [-1,1]){
        ctx.save();ctx.scale(1,sign);const jet=13+28*clamp(t/.085),width=5*(1-u);
        shape(ctx,[[-width,5],[-width*.6,-jet*.5],[-width*.2,-jet],[width*.4,-jet*.7],[width,5]],'#43b9ef');
        shape(ctx,[[-width*.35,0],[0,-jet*.93],[width*.3,0]],'#dcffff');ctx.restore();
      }
      ctx.restore();
    }
  }
  function drawOne(canvas){
    const bounds=canvas.getBoundingClientRect(),width=bounds.width,height=bounds.height,dpr=Math.min(devicePixelRatio||1,2);
    canvas.width=Math.round(width*dpr);canvas.height=Math.round(height*dpr);
    const ctx=canvas.getContext('2d');ctx.scale(dpr,dpr);
    ctx.fillStyle='#0c1421';ctx.fillRect(0,0,width,height);
    const type=canvas.dataset.effect;
    ctx.font='12px system-ui';ctx.fillStyle='#aebac8';ctx.textAlign='center';
    if(type==='seismic'){
      const narrow=width<480,mainWidth=narrow?width:width*.72;
      const views=narrow?[[width/2,98,(width-36)/215,.23],[width/2,235,.48,1]]:[[mainWidth/2,125,(mainWidth-36)/215,.23],[width*.86,125,Math.min(.64,(width*.28-24)/215),1]];
      views.forEach(v=>{ctx.save();ctx.translate(v[0],v[1]);ctx.scale(v[2],v[2]);seismic(ctx,time,v[3]);ctx.restore()});
      ctx.fillStyle='#aebac8';ctx.fillText('Oblique view',views[0][0],narrow?160:230);ctx.fillText('Overhead view',views[1][0],narrow?310:230);
    }else{
      const bigX=width*.36,smallX=width*.82,scale=Math.min(.73,(width*.63-24)/215);
      for(const v of [[bigX,85,scale],[smallX,85,.43]]){ctx.save();ctx.translate(v[0],v[1]);ctx.scale(v[2],v[2]);missile(ctx,time,false);ctx.restore()}
      ctx.fillStyle='#aebac8';ctx.fillText('Enlarged',bigX,160);ctx.fillText('96 px box',smallX,160);
    }
  }
  function draw(){canvases.forEach(drawOne);slider.value=Math.round(time*1000);clock.textContent=Math.round(time*1000)+' ms'}
  function stop(){cancelAnimationFrame(frame);playing=false;play.textContent='Play all'}
  function save(){if(window.openai&&window.openai.setWidgetState)window.openai.setWidgetState({modelContent:null,privateContent:{revision:3,milliseconds:Math.round(time*1000),slow:slow.checked}}).catch(()=>{})}
  slider.addEventListener('input',()=>{stop();time=+slider.value/1000;draw()});slider.addEventListener('change',save);
  slow.addEventListener('change',()=>{stop();save()});
  play.addEventListener('click',()=>{
    if(playing){stop();save();return}
    if(reduced){time=Math.min(1.1,time+.05);if(time>=1.1)time=0;draw();status.textContent='Reduced motion · use the time slider to inspect each pose';return}
    playing=true;time=0;start=performance.now();play.textContent='Pause';
    const tick=(now)=>{time=Math.min(1.1,(now-start)/1000/(slow.checked?4:1));draw();if(time<1.1)frame=requestAnimationFrame(tick);else{stop();save()}};
    frame=requestAnimationFrame(tick);
  });
  function restore(state){const s=state&&state.privateContent;if(!s||s.revision!==3)return;stop();time=Math.max(0,Math.min(1100,Number(s.milliseconds)||0))/1000;slow.checked=!!s.slow;draw()}
  if(window.openai)restore(window.openai.widgetState);
  window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState)restore(e.detail.globals.widgetState)});
  new ResizeObserver(draw).observe(root);
  draw();
})();
</script>
