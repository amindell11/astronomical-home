<div id="dash-look-preview">
  <div class="dash-scene">
    <canvas role="img" aria-label="Vanguard dashing to the right, leaving a diffuse cloud of expanding particles and fading afterimages"></canvas>
    <div class="dash-scene-label"><span>Vanguard</span><span class="text-small" data-phase>Ready</span></div>
  </div>
  <div class="viz-controls dash-transport">
    <button class="btn btn-primary" type="button" data-play>Pause</button>
    <button class="btn" type="button" data-replay>Replay</button>
    <label class="form-label">Speed <select class="form-select" data-speed><option value="0.25">0.25x</option><option value="0.5">0.5x</option><option value="1" selected>1x</option></select></label>
    <label class="form-label">View <select class="form-select" data-view><option value="close">Close-up</option><option value="game">Game scale</option></select></label>
  </div>
  <label class="dash-slider">
    <span>Timeline <output class="tabular-nums" data-time>0 ms</output></span>
    <input class="form-range" type="range" min="0" max="1740" step="1" value="0" data-scrub>
  </label>
  <hr>
  <div class="dash-tuning">
    <section aria-label="Engine burst">
      <h3>Engine burst</h3>
      <div data-controls="burst"></div>
    </section>
    <section aria-label="Afterimages">
      <h3>Afterimages</h3>
      <div data-controls="ghost"></div>
    </section>
    <section aria-label="Shockwave">
      <h3>Shockwave</h3>
      <div data-controls="wave"></div>
    </section>
  </div>
  <div class="viz-row">
    <button class="btn" type="button" data-use>Use these settings</button>
    <span class="text-small text-muted" aria-live="polite" data-feedback></span>
  </div>
  <label class="form-label" data-copy hidden>Dash settings <textarea class="form-control" readonly rows="4"></textarea></label>
</div>
<style>
  #dash-look-preview { display: grid; grid-template-columns: minmax(0, 1fr); min-width: 0; gap: calc(var(--font-size-base, 14px) * .8); }
  #dash-look-preview > *, #dash-look-preview .dash-tuning > *, #dash-look-preview .dash-slider { min-width: 0; }
  #dash-look-preview [data-copy][hidden] { display: none !important; }
  #dash-look-preview .dash-scene { position: relative; width: 100%; aspect-ratio: 2.55; min-height: 155px; overflow: clip; }
  #dash-look-preview canvas { display: block; width: 100%; height: 100%; }
  #dash-look-preview .dash-scene-label { position: absolute; inset: .7em auto auto .85em; display: grid; gap: .15em; color: #e7eef8; pointer-events: none; }
  #dash-look-preview [data-phase] { color: #a6b9d1; }
  #dash-look-preview .dash-transport { align-items: end; }
  #dash-look-preview .dash-slider { display: grid; gap: .12em; }
  #dash-look-preview .dash-slider span { display: flex; justify-content: space-between; gap: .6em; }
  #dash-look-preview output { color: var(--muted-foreground); }
  #dash-look-preview .dash-tuning { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: calc(var(--font-size-base, 14px) * 1.8); }
  #dash-look-preview h3 { margin-bottom: .4em; }
  #dash-look-preview [data-controls] { display: grid; gap: .32em; }
  @media (max-width: 460px) { #dash-look-preview .dash-tuning { grid-template-columns: minmax(0, 1fr); gap: .7em; } }
</style>
<script>
(() => {
  const root = document.getElementById('dash-look-preview');
  const select = (query) => root.querySelector(query);
  const canvas = select('canvas');
  const context = canvas.getContext('2d');
  const play = select('[data-play]');
  const scrub = select('[data-scrub]');
  const speedControl = select('[data-speed]');
  const viewControl = select('[data-view]');
  const phaseOutput = select('[data-phase]');
  const timeOutput = select('[data-time]');
  const groupNames = { burst: 'Engine burst', ghost: 'Afterimage', wave: 'Shockwave' };
  const fields = [
    { key: 'burstStrength', group: 'burst', label: 'Strength', min: 0, max: 180, step: 5, initial: 100, unit: '%' },
    { key: 'burstLength', group: 'burst', label: 'Length', min: 20, max: 200, step: 5, initial: 100, unit: '%' },
    { key: 'burstDuration', group: 'burst', label: 'Duration', min: 40, max: 400, step: 5, initial: 180, unit: ' ms' },
    { key: 'flashStrength', group: 'burst', label: 'Flash strength', min: 0, max: 180, step: 5, initial: 100, unit: '%' },
    { key: 'flashDuration', group: 'burst', label: 'Flash duration', min: 30, max: 180, step: 5, initial: 90, unit: ' ms' },
    { key: 'ghostCount', group: 'ghost', label: 'Count', min: 0, max: 5, step: 1, initial: 2, unit: '' },
    { key: 'ghostSpacing', group: 'ghost', label: 'Spacing', min: 25, max: 120, step: 5, initial: 65, unit: ' ms' },
    { key: 'ghostOpacity', group: 'ghost', label: 'Opacity', min: 0, max: 80, step: 1, initial: 32, unit: '%' },
    { key: 'ghostFade', group: 'ghost', label: 'Fade', min: 40, max: 500, step: 5, initial: 240, unit: ' ms' },
    { key: 'waveSize', group: 'wave', label: 'Size', min: 35, max: 155, step: 5, initial: 100, unit: '%' },
    { key: 'waveStrength', group: 'wave', label: 'Strength', min: 0, max: 180, step: 5, initial: 100, unit: '%' },
    { key: 'waveDuration', group: 'wave', label: 'Duration', min: 80, max: 500, step: 5, initial: 240, unit: ' ms' },
  ];
  const settings = Object.fromEntries(fields.map(({ key, initial }) => [key, initial]));
  const dashStart = 300;
  const dashDuration = 275;
  const loopDuration = 1740;
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let playing = !reduced;
  let time = reduced ? dashStart + 135 : 0;
  let lastFrame;
  let frameRequest;
  let ship = null;
  let view = 'close';
  let speed = 1;
  const clamp = (value, min, max) => Math.min(max, Math.max(min, value));

  function persist() {
    window.openai?.setWidgetState?.({ modelContent: { ...settings }, privateContent: { speed, view } })?.catch(() => {});
  }

  for (const field of fields) {
    const label = document.createElement('label');
    label.className = 'dash-slider';
    label.innerHTML = `<span>${field.label} <output class="tabular-nums"></output></span><input class="form-range" type="range" min="${field.min}" max="${field.max}" step="${field.step}">`;
    field.output = label.querySelector('output');
    field.control = label.querySelector('input');
    field.control.addEventListener('input', () => {
      settings[field.key] = Number(field.control.value);
      field.output.textContent = `${settings[field.key]}${field.unit}`;
      if (field.key === 'ghostCount') syncSpacing();
      render();
      refreshConfig();
    });
    field.control.addEventListener('change', persist);
    select(`[data-controls="${field.group}"]`).append(label);
  }

  function syncSpacing() {
    const field = fields.find(({ key }) => key === 'ghostSpacing');
    const intervals = Math.max(1, settings.ghostCount - 1);
    const max = Math.min(field.max, Math.floor((dashDuration - 35) / intervals / field.step) * field.step);
    field.control.max = max;
    settings.ghostSpacing = Math.min(settings.ghostSpacing, max);
    field.control.value = settings.ghostSpacing;
    field.output.textContent = `${settings.ghostSpacing}${field.unit}`;
  }

  function restore(state) {
    for (const field of fields) {
      const saved = state?.modelContent?.[field.key];
      settings[field.key] = Number.isFinite(saved)
        ? clamp(Math.round((saved - field.min) / field.step) * field.step + field.min, field.min, field.max)
        : field.initial;
      field.control.value = settings[field.key];
      field.output.textContent = `${settings[field.key]}${field.unit}`;
    }
    syncSpacing();
    const savedSpeed = state?.privateContent?.speed;
    speed = [.25, .5, 1].includes(savedSpeed) ? savedSpeed : 1;
    view = state?.privateContent?.view === 'game' ? 'game' : 'close';
    speedControl.value = speed;
    viewControl.value = view;
    render();
    refreshConfig();
  }

  function extractShip(image) {
    const source = document.createElement('canvas');
    source.width = image.width;
    source.height = image.height;
    const sourceContext = source.getContext('2d', { willReadFrequently: true });
    sourceContext.drawImage(image, 0, 0);
    const { width, height } = source;
    const pixels = sourceContext.getImageData(0, 0, width, height);
    const queue = new Uint32Array(width * height);
    const seen = new Uint8Array(width * height);
    let head = 0;
    let tail = 0;
    function enqueue(index) {
      if (seen[index]) return;
      seen[index] = 1;
      const offset = index * 4;
      const [r, g, b] = pixels.data.subarray(offset, offset + 3);
      if (r <= 13 && g <= 14 && b <= 16 && Math.max(r, g, b) - Math.min(r, g, b) <= 5) {
        queue[tail++] = index;
        pixels.data[offset + 3] = 0;
      }
    }
    for (let x = 0; x < width; x++) { enqueue(x); enqueue((height - 1) * width + x); }
    for (let y = 0; y < height; y++) { enqueue(y * width); enqueue(y * width + width - 1); }
    while (head < tail) {
      const index = queue[head++];
      const x = index % width;
      if (x > 0) enqueue(index - 1);
      if (x < width - 1) enqueue(index + 1);
      if (index >= width) enqueue(index - width);
      if (index < width * (height - 1)) enqueue(index + width);
    }
    sourceContext.putImageData(pixels, 0, 0);
    return source;
  }

  function shipPosition(at, width) {
    const progress = clamp((at - dashStart) / dashDuration, 0, 1);
    const travel = 1 - (1 - progress) ** 1.7;
    return width * (.27 + .52 * travel);
  }

  function drawShip(x, y, hullSize, alpha) {
    if (!ship) return;
    context.save();
    context.translate(x, y);
    context.rotate(Math.PI / 2);
    context.globalAlpha = alpha;
    const factor = hullSize / 325;
    context.drawImage(ship, -135 * factor, -194 * factor, ship.width * factor, ship.height * factor);
    context.restore();
  }

  function drawAtEngineExits(x, y, hullSize, draw) {
    for (const side of [-1, 1]) {
      context.save();
      context.translate(x - hullSize * .31, y + side * hullSize * .155);
      context.globalCompositeOperation = 'lighter';
      draw();
      context.restore();
    }
  }

  function drawSteadyExhaust(x, y, hullSize) {
    const length = hullSize * .22;
    const width = hullSize * .025;
    drawAtEngineExits(x, y, hullSize, () => {
      const gradient = context.createLinearGradient(0, 0, -length, 0);
      gradient.addColorStop(0, '#b7f7ff');
      gradient.addColorStop(.28, 'rgba(69,205,255,.78)');
      gradient.addColorStop(1, 'rgba(18,134,255,0)');
      context.fillStyle = gradient;
      context.beginPath();
      context.moveTo(0, -width);
      context.quadraticCurveTo(-length * .65, -width * .55, -length, 0);
      context.quadraticCurveTo(-length * .65, width * .55, 0, width);
      context.fill();
    });
  }

  function drawBurst(x, y, hullSize, age) {
    const { burstDuration, burstStrength, burstLength } = settings;
    if (age < 0 || age >= burstDuration || burstStrength === 0) return;
    const ageRatio = age / burstDuration;
    const pulse = (1 - ageRatio) ** 1.4;
    const intensity = burstStrength / 100;
    const length = hullSize * .83 * burstLength / 100 * (.42 + .58 * pulse);
    const spread = hullSize * (.028 + .053 * pulse);
    drawAtEngineExits(x, y, hullSize, () => {
      function wedge(distance, width, alpha, colors) {
        const gradient = context.createLinearGradient(0, 0, -distance, 0);
        colors.forEach(([fraction, color]) => gradient.addColorStop(fraction, color));
        context.globalAlpha = clamp(alpha, 0, 1);
        context.fillStyle = gradient;
        context.beginPath();
        context.moveTo(0, -width * .35);
        context.lineTo(-distance * .21, -width);
        context.lineTo(-distance, 0);
        context.lineTo(-distance * .32, width * .72);
        context.lineTo(0, width * .33);
        context.closePath();
        context.fill();
      }
      wedge(length, spread, pulse * intensity * .9, [[0, '#b5fcff'], [.18, '#52deff'], [.56, '#158fec'], [1, 'rgba(21,143,236,0)']]);
      wedge(length * .67, spread * .36, pulse * intensity, [[0, '#ffffff'], [.31, '#ecfeff'], [.67, '#75eaff'], [1, 'rgba(117,234,255,0)']]);
    });
  }

  function drawEngineFlash(x, y, hullSize, age) {
    const { flashStrength, flashDuration } = settings;
    if (age < 0 || age >= flashDuration || flashStrength === 0) return;
    const attack = clamp((age + 8) / 14, 0, 1);
    const pulse = attack * (1 - age / flashDuration) ** 1.35;
    const intensity = flashStrength / 100;
    const radius = Math.max(4, hullSize * .145) * (.7 + .3 * pulse);
    drawAtEngineExits(x, y, hullSize, () => {
      context.translate(-hullSize * .018, 0);
      context.scale(1.22, 1);
      const bloom = context.createRadialGradient(0, 0, 0, 0, 0, radius);
      bloom.addColorStop(0, '#ffffff');
      bloom.addColorStop(.2, '#c3faff');
      bloom.addColorStop(.48, 'rgba(49,206,255,.52)');
      bloom.addColorStop(1, 'rgba(28,176,255,0)');
      context.globalAlpha = clamp(pulse * intensity, 0, 1);
      context.fillStyle = bloom;
      context.fillRect(-radius, -radius, radius * 2, radius * 2);
      context.fillStyle = '#faffff';
      context.beginPath();
      context.ellipse(0, 0, radius * .23, radius * .13, 0, 0, Math.PI * 2);
      context.fill();
    });
  }

  let particleSeed = 9483;
  function particleRandom() {
    particleSeed = (Math.imul(1664525, particleSeed) + 1013904223) >>> 0;
    return particleSeed / 4294967296;
  }

  const wavePuffs = ['226,232,237', '183,201,214', '149,173,191'].map((color) => {
    const sprite = document.createElement('canvas');
    sprite.width = sprite.height = 64;
    const brush = sprite.getContext('2d');
    const fade = brush.createRadialGradient(32, 32, 0, 32, 32, 32);
    fade.addColorStop(0, `rgba(${color},.87)`);
    fade.addColorStop(.37, `rgba(${color},.62)`);
    fade.addColorStop(.69, `rgba(${color},.21)`);
    fade.addColorStop(1, `rgba(${color},0)`);
    brush.fillStyle = fade;
    brush.fillRect(0, 0, 64, 64);
    return sprite;
  });

  const cloudClusters = [-2.45, -1.55, -.43, .63, 1.42, 2.25, 3.04];
  const waveParticles = Array.from({ length: 86 }, (_, index) => {
    const mote = index >= 68;
    const angle = cloudClusters[index % cloudClusters.length] + (particleRandom() - .5) * .68;
    return {
      mote,
      directionX: Math.cos(angle) * .39,
      directionY: Math.sin(angle),
      reach: .42 + particleRandom() * (mote ? .67 : .48),
      drift: (particleRandom() - .55) * .2,
      radius: mote ? .005 + particleRandom() * .01 : .036 + particleRandom() * .084,
      shape: .44 + particleRandom() * .54,
      angle: (particleRandom() - .5) * Math.PI,
      opacity: .2 + particleRandom() * .37,
      start: particleRandom() * .13,
      span: .54 + particleRandom() * .45,
      sprite: wavePuffs[Math.floor(particleRandom() * wavePuffs.length)],
    };
  });

  function drawShockwave(x, y, hullSize, age) {
    const { waveSize, waveStrength, waveDuration } = settings;
    if (age < 0 || age >= waveDuration || waveStrength === 0) return;
    const progress = age / waveDuration;
    const expansion = 1 - (1 - progress) ** 2.45;
    const scale = hullSize * waveSize / 100;
    const strength = waveStrength / 100;

    context.save();
    for (const particle of waveParticles) {
      const life = (progress - particle.start) / particle.span;
      if (life < 0 || life >= 1) continue;
      const reach = scale * (.10 + expansion * particle.reach);
      const px = x + reach * particle.directionX + scale * particle.drift * expansion;
      const py = y + reach * particle.directionY;
      const opacity = particle.opacity * Math.min(1, .3 + life * 9) * (1 - life) ** 1.3;
      context.globalAlpha = clamp(strength * opacity, 0, 1);
      if (particle.mote) {
        const size = Math.max(.65, scale * particle.radius);
        context.fillStyle = '#deebf0';
        context.fillRect(px, py, size, size);
      } else {
        const radius = Math.max(1.4, scale * particle.radius * (.75 + life * .85));
        context.save();
        context.translate(px, py);
        context.rotate(particle.angle);
        const height = radius * particle.shape;
        context.drawImage(particle.sprite, -radius, -height, radius * 2, height * 2);
        context.restore();
      }
    }
    context.restore();
  }

  function drawAfterimages(w, h, hullSize) {
    const { ghostCount, ghostSpacing, ghostOpacity, ghostFade } = settings;
    for (let index = 0; index < ghostCount; index++) {
      const sampleTime = dashStart + index * ghostSpacing;
      const appearAt = sampleTime + Math.max(22, ghostSpacing * .62);
      const age = time - appearAt;
      if (age < 0 || age >= ghostFade) continue;
      drawShip(shipPosition(sampleTime, w), h * .55, hullSize, ghostOpacity / 100 * (1 - age / ghostFade));
    }
  }

  function render() {
    const { width, height } = canvas.getBoundingClientRect();
    if (!width || !height) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const pixelWidth = Math.round(width * dpr);
    const pixelHeight = Math.round(height * dpr);
    if (canvas.width !== pixelWidth || canvas.height !== pixelHeight) {
      canvas.width = pixelWidth;
      canvas.height = pixelHeight;
    }
    context.setTransform(dpr, 0, 0, dpr, 0, 0);
    const background = context.createLinearGradient(0, 0, 0, height);
    background.addColorStop(0, '#101926');
    background.addColorStop(.68, '#0b111a');
    background.addColorStop(1, '#0d141e');
    context.fillStyle = background;
    context.fillRect(0, 0, width, height);
    for (let i = 0; i < 71; i++) {
      const x = ((i * 137 + 37) % 811) / 811 * width;
      const y = ((i * i * 53 + 29) % 787) / 787 * height;
      context.fillStyle = i % 7 === 0 ? 'rgba(157,194,221,.32)' : 'rgba(157,194,221,.17)';
      context.fillRect(x, y, i % 7 === 0 ? 1.3 : 1, 1);
    }
    const hullSize = view === 'close' ? Math.min(width * .23, height * .58, 158) : Math.min(width * .11, height * .29, 68);
    const x = shipPosition(time, width);
    const y = height * .55;
    drawAfterimages(width, height, hullSize);
    drawShockwave(shipPosition(dashStart, width) - hullSize * .29, y, hullSize, time - dashStart);
    drawSteadyExhaust(x, y, hullSize);
    drawBurst(x, y, hullSize, time - dashStart);
    drawShip(x, y, hullSize, 1);
    drawEngineFlash(x, y, hullSize, time - dashStart);
    const rounded = Math.round(time);
    scrub.value = rounded;
    timeOutput.textContent = `${rounded} ms`;
    const { ghostCount, ghostSpacing, ghostOpacity, ghostFade, burstDuration, burstStrength, waveDuration, waveStrength } = settings;
    const afterimageEnd = ghostCount && ghostOpacity
      ? dashStart + (ghostCount - 1) * ghostSpacing + Math.max(22, ghostSpacing * .62) + ghostFade
      : 0;
    const waveEnd = waveStrength ? dashStart + waveDuration : 0;
    const activeEnd = Math.max(dashStart + dashDuration, burstStrength ? dashStart + burstDuration : 0, afterimageEnd, waveEnd);
    phaseOutput.textContent = time < dashStart ? 'Ready' : time < dashStart + dashDuration ? 'Dash' : time < activeEnd ? 'Recovery' : 'Settled';
  }

  function animate(stamp) {
    frameRequest = undefined;
    if (!playing) return;
    if (lastFrame !== undefined) time = (time + Math.min(stamp - lastFrame, 100) * speed) % loopDuration;
    lastFrame = stamp;
    render();
    frameRequest = requestAnimationFrame(animate);
  }

  function setPlaying(active) {
    playing = active;
    play.textContent = active ? 'Pause' : 'Play';
    lastFrame = undefined;
    if (active && frameRequest === undefined) frameRequest = requestAnimationFrame(animate);
    if (!active && frameRequest !== undefined) {
      cancelAnimationFrame(frameRequest);
      frameRequest = undefined;
    }
  }

  play.addEventListener('click', () => {
    if (!playing && time >= loopDuration) time = 0;
    setPlaying(!playing);
  });
  select('[data-replay]').addEventListener('click', () => { time = 0; render(); setPlaying(true); });
  scrub.addEventListener('input', () => { setPlaying(false); time = Number(scrub.value); render(); });
  speedControl.addEventListener('change', () => { speed = Number(speedControl.value); persist(); });
  viewControl.addEventListener('change', () => { view = viewControl.value; render(); persist(); });

  const copy = select('[data-copy]');
  const config = copy.querySelector('textarea');
  const feedback = select('[data-feedback]');
  function refreshConfig() {
    config.value = fields.map(({ group, key, label, unit }) => `${groupNames[group]} ${label.toLowerCase()} = ${settings[key]}${unit}`).join('\n');
  }
  select('[data-use]').addEventListener('click', async () => {
    persist();
    if (window.openai?.sendFollowUpMessage) {
      try {
        await window.openai.sendFollowUpMessage({ title: 'Use Dash preview settings', prompt: `Use these settings for the Dash VFX direction:\n${config.value}` });
        return;
      } catch { feedback.textContent = 'Copy the settings below.'; }
    }
    copy.hidden = false;
    config.focus();
    config.select();
  });

  window.addEventListener('openai:set_globals', (event) => {
    const globals = event.detail?.globals;
    if (globals && 'widgetState' in globals) restore(globals.widgetState);
  });
  new ResizeObserver(render).observe(canvas);
  restore(window.openai?.widgetState);
  const sourceArt = new Image();
