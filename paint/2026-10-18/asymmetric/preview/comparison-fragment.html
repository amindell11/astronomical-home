<style>
#vanguard-asymmetry .ship-comparison { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; margin:16px 0; }
#vanguard-asymmetry figure { margin:0; min-width:0; }
#vanguard-asymmetry figcaption { margin-bottom:8px; color:var(--foreground); font-weight:500; }
#vanguard-asymmetry .ship-frame { display:flex; align-items:center; justify-content:center; height:var(--frame-height,360px); }
#vanguard-asymmetry img { display:block; max-width:100%; max-height:100%; width:auto; height:var(--ship-height,360px); object-fit:contain; }
#vanguard-asymmetry img[data-image="valis"] { transform:rotate(180deg); }
@media(max-width:600px) { #vanguard-asymmetry .ship-comparison { grid-template-columns:1fr; } }
</style>
<script>
(() => {
  const root = document.getElementById('vanguard-asymmetry');
  const size = root.querySelector('[data-size]');
  const caption = root.querySelector('[data-caption]');
  function apply(value) {
    const chosen = ['fit','150','100','60'].includes(value) ? value : 'fit';
    size.value = chosen;
    root.style.setProperty('--ship-height', chosen === 'fit' ? '360px' : chosen + 'px');
    root.style.setProperty('--frame-height', chosen === 'fit' ? '360px' : '170px');
    caption.textContent = chosen === 'fit' ? 'Blender previews · Unity review deferred' : 'Ship height: ' + chosen + ' CSS pixels · Blender previews';
  }
  apply(window.openai?.widgetState?.modelContent?.shipHeight);
  size.addEventListener('change', () => {
    apply(size.value);
    window.openai?.setWidgetState({modelContent:{shipHeight:size.value},privateContent:null}).catch(() => {});
  });
  window.addEventListener('openai:set_globals', event => {
    if (event.detail?.globals?.widgetState) apply(event.detail.globals.widgetState.modelContent?.shipHeight);
  });
})();
</script>
