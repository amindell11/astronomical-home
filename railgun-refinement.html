<style>
#railgun-refinement { display:grid; gap:16px; }
#railgun-refinement .rg-caption { display:flex; justify-content:space-between; gap:6px 18px; flex-wrap:wrap; margin-bottom:7px; }
#railgun-refinement .rg-caption > :first-child { font-weight:500; }
#railgun-refinement .rg-caption > :last-child { color:var(--muted-foreground); }
#railgun-refinement canvas { display:block; width:100%; height:215px; background:#050c21; }
#railgun-refinement .rg-timeline { display:block; }
#railgun-refinement #rg-phase { float:right; font-weight:400; }
#railgun-refinement .rg-footer { color:var(--muted-foreground); }
#railgun-refinement .rg-tuning[open] > div { margin-top:12px; }
@media(max-width:450px) { #railgun-refinement .rg-caption { display:grid; gap:3px; } }
</style>
<script>
(() => {
  const root = document.getElementById('railgun-refinement');
  const data = JSON.parse(root.querySelector('#rg-source-data').textContent);
  const candidates = [...root.querySelectorAll('[data-kind]')];
  const canvases = candidates;
  const play = root.querySelector('#rg-play');
  const fire = root.querySelector('#rg-fire');
  const speed = root.querySelector('#rg-speed');
  const force = root.querySelector('#rg-force');
  const dash = root.querySelector('#rg-dash');
  const gap = root.querySelector('#rg-gap');
  const gapValue = root.querySelector('#rg-gap-value');
  const time = root.querySelector('#rg-time');
  const phase = root.querySelector('#rg-phase');
  const TAU = Math.PI * 2;
  const chargeDuration = 1.5, shotDuration = .34, cycleDuration = 2.4;
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const state = {time:.8, speed:1, force:'heavy', dash:'tapered', gap:.55, playing:!reduced, once:false};
  const P = {rim:'#2D6BFF', mid:'#5CCBFF', hot:'#D9F7FF', core:'#FFFFFF', fringe:'#8A7BFF'};
  const bodies = data.body.map(frame => frame.map(p => ({...p, path:new Path2D(p.d)})));
  const fringes = data.fringe.map(frame => frame.map(p => ({...p, path:new Path2D(p.d)})));
  const sky = new Image(); sky.src=data.sky;
  const clamp = (x,a=0,b=1) => Math.min(b,Math.max(a,x));
  const ease = q => q*q*(3-2*q);
  const opacity = q => .68*Math.pow(q,2.2);
  function restore(saved) {
    const v=saved?.modelContent;
    if(v?.version!==2) return;
    if(['heavy','earlier'].includes(v.force)) state.force=v.force;
    if(['tapered','bar'].includes(v.dash)) state.dash=v.dash;
    if(typeof v.gap==='number') state.gap=clamp(v.gap,.3,.75);
    if([.25,1].includes(v.speed)) state.speed=v.speed;
    if(typeof saved.privateContent?.time==='number') state.time=clamp(saved.privateContent.time,0,cycleDuration);
    if(typeof saved.privateContent?.playing==='boolean') state.playing=saved.privateContent.playing && !reduced;
    updateControls();
  }
  function save() {
    if(window.openai?.setWidgetState) window.openai.setWidgetState({modelContent:{version:2,direction:'inward draw',beam:'crackling lance',fade:'slow curve',force:state.force,dash:state.dash,gap:state.gap,speed:state.speed},privateContent:{time:state.time,playing:state.playing}}).catch(()=>{});
  }
  function updateControls() {
    speed.value=state.speed;force.value=state.force;dash.value=state.dash;gap.value=Math.round(state.gap*100);
    gapValue.textContent=Math.round(state.gap*100)+'%';play.textContent=state.playing?'Pause':'Play';
    root.querySelector('#rg-summary').textContent='Concept playback · 1.5 s charge · '+(state.force==='heavy'?'0.34':'0.28')+' s burst and afterglow';
  }
  play.addEventListener('click',()=>{state.playing=!state.playing;state.once=false;updateControls();save();});
  fire.addEventListener('click',()=>{state.time=1.36;state.playing=true;state.once=true;updateControls();save();});
  speed.addEventListener('change',()=>{state.speed=Number(speed.value);save();});
  force.addEventListener('change',()=>{state.force=force.value;updateControls();save();drawAll();});
  dash.addEventListener('change',()=>{state.dash=dash.value;save();drawAll();});
  gap.addEventListener('input',()=>{state.gap=Number(gap.value)/100;updateControls();save();drawAll();});
  time.addEventListener('input',()=>{state.time=Number(time.value);state.playing=false;state.once=false;updateControls();save();drawAll();});
  window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState) restore(e.detail.globals.widgetState);});
  restore(window.openai?.widgetState); updateControls();
  function resize() {
    const dpr=Math.min(devicePixelRatio||1,2);
    for(const c of canvases) {
      c.width=Math.round(c.clientWidth*dpr);c.height=Math.round(c.clientHeight*dpr);
      c.getContext('2d').setTransform(dpr,0,0,dpr,0,0);
    }
    drawAll();
  }
  function line(ctx,x1,y1,x2,y2,width,color,alpha=1) {
    ctx.save();ctx.globalAlpha=clamp(alpha);ctx.strokeStyle=color;ctx.lineWidth=width;
    ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.restore();
  }
  function glow(ctx,x,y,rx,ry,alpha) {
    ctx.save();ctx.translate(x,y);ctx.scale(rx,ry);
    const g=ctx.createRadialGradient(0,0,0,0,0,1);g.addColorStop(0,'rgba(92,203,255,.7)');g.addColorStop(.25,'rgba(45,107,255,.32)');g.addColorStop(1,'rgba(45,107,255,0)');
    ctx.fillStyle=g;ctx.globalAlpha=clamp(alpha);ctx.beginPath();ctx.arc(0,0,1,0,TAU);ctx.fill();ctx.restore();
  }
  function polygon(ctx,pts,color,alpha=1) {
    ctx.save();ctx.globalAlpha=clamp(alpha);ctx.fillStyle=color;ctx.beginPath();
    pts.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.closePath();ctx.fill();ctx.restore();
  }
  function referenceLayer(ctx,parts,x,y,length,half,alpha,onlyRim=false) {
    if(alpha<=0) return;
    ctx.save();ctx.translate(x,y);ctx.scale(length/1960,half/30);ctx.translate(-40,-128);
    for(let i=0;i<parts.length;i++) {
      if(onlyRim && i>1) break;
      const p=parts[i];ctx.globalAlpha=clamp(alpha*Number(p.opacity??1));
      if(p.fill && p.fill!=='none') {ctx.fillStyle=p.fill;ctx.fill(p.path);}
      if(p.stroke) {ctx.strokeStyle=p.stroke;ctx.lineWidth=Number(p['stroke-width']||1);ctx.stroke(p.path);}
    }
    ctx.restore();
  }
  function body(ctx,x,y,length,half,t,alpha,fringe=0,onlyRim=false) {
    const f=t*16, i=Math.floor(f)%4, blend=ease(f%1);
    referenceLayer(ctx,bodies[i],x,y,length,half,alpha*(1-blend),onlyRim);
    referenceLayer(ctx,bodies[(i+1)%4],x,y,length,half,alpha*blend,onlyRim);
    if(fringe>0) {
      referenceLayer(ctx,fringes[i],x,y,length,half,alpha*fringe*(1-blend));
      referenceLayer(ctx,fringes[(i+1)%4],x,y,length,half,alpha*fringe*blend);
    }
  }
  function background(ctx,w,h,scene=false) {
    ctx.clearRect(0,0,w,h);ctx.fillStyle='#050c21';ctx.fillRect(0,0,w,h);
    if(scene && sky.complete && sky.naturalWidth) {
      ctx.globalAlpha=.65;ctx.drawImage(sky,0,170,740,260,0,0,w,h);ctx.globalAlpha=1;
      const g=ctx.createLinearGradient(0,0,0,h);g.addColorStop(0,'rgba(3,8,22,.15)');g.addColorStop(.6,'rgba(3,8,22,.3)');g.addColorStop(1,'rgba(3,8,22,.84)');ctx.fillStyle=g;ctx.fillRect(0,0,w,h);
    }
  }
  function ship(ctx,x,y,s) {
    ctx.save();ctx.translate(x,y);ctx.scale(s,s);
    polygon(ctx,[[-26,-17],[-9,-12],[9,-6],[18,0],[9,6],[-9,12],[-26,17],[-19,4],[-25,0],[-19,-4]],'#090c17');
    polygon(ctx,[[-22,-14],[-8,-10],[12,0],[-8,10],[-22,14],[-14,3],[-20,0],[-14,-3]],'#829aa6');
    polygon(ctx,[[-22,-14],[-8,-10],[12,0],[-4,-2],[-15,-6]],'#c9d3cf');
    polygon(ctx,[[-22,14],[-8,10],[12,0],[-5,3],[-15,8]],'#344c65');
    polygon(ctx,[[-12,-3],[2,0],[-12,3]],'#e9a563');
    line(ctx,-21,-8,-10,-5,2,'#773c44');line(ctx,-21,8,-10,5,2,'#773c44');
    glow(ctx,-23,0,14,6,.3);ctx.restore();
  }
  function target(ctx,x,y,s) {
    ctx.save();ctx.translate(x,y);ctx.scale(s,s);
    polygon(ctx,[[-10,-14],[6,-17],[16,-7],[14,9],[3,17],[-13,8],[-17,-3]],'#263a50');
    polygon(ctx,[[-10,-14],[6,-17],[16,-7],[1,-4],[-13,8],[-17,-3]],'#667887');
    polygon(ctx,[[6,-17],[16,-7],[14,9],[5,3],[1,-4]],'#b9a187');
    polygon(ctx,[[-10,-14],[1,-4],[-13,8],[-6,-2]],'#3c5165');ctx.restore();
  }
  function streak(ctx,x,y,length,direction,alpha,scale) {
    polygon(ctx,[[x,y],[x-direction*length,y-1.1*scale],[x-direction*length*.65,y],[x-direction*length,y+1.1*scale]],P.hot,alpha);
  }
  function aim(ctx,x,y,length,q,t,kind,scale) {
    const a=opacity(q), width=Math.max(.65,.85*scale);
    if(q<=0) return;
    const travel=.18*t+.6*t*t*t/(3*chargeDuration*chargeDuration);
    ctx.save();ctx.beginPath();ctx.rect(x,y-9*scale,length,18*scale);ctx.clip();
    if(kind==='continuous') {
      glow(ctx,x+length*.5,y,length*.55,4*scale,a*.25);
      line(ctx,x,y,x+length,y,width,P.mid,a*.62);
      for(let i=0;i<7;i++) {
        const u=(i/7-travel+100)%1;
        streak(ctx,x+u*length,y,length*(.035+.015*q),-1,a*(.65+.35*q),scale);
      }
    } else {
      const pitch=length/10, dashLength=pitch*(1-state.gap);
      const offset=-(travel*length)%pitch;
      for(let i=-1;i<=11;i++) {
        const start=x+i*pitch+offset;
        const half=Math.max(.65,1.25*scale);
        if(state.dash==='tapered') {
          polygon(ctx,[[start,y],[start+dashLength*.21,y-half],[start+dashLength,y-half*.38],[start+dashLength,y+half*.38],[start+dashLength*.21,y+half]],P.mid,a*.9);
          line(ctx,start+dashLength*.15,y,start+dashLength*.65,y,Math.max(.55,.6*scale),P.hot,a);
        } else {
          line(ctx,start,y,start+dashLength,y,half*1.3,P.mid,a*.9);
          line(ctx,start,y,start+Math.min(3*scale,dashLength*.35),y,half*1.3,P.hot,a);
        }
      }
    }
    ctx.restore();
    glow(ctx,x,y,(5+8*q*q)*scale,(4+6*q*q)*scale,a*.8);
    if(q>.74) {
      const pinch=1-clamp((q-.94)/.06)*.5;
      line(ctx,x,y-4*scale*pinch,x,y+4*scale*pinch,.9*scale,P.hot,a*(q-.74)*2);
    }
  }
  function earlierShot(ctx,x,y,length,dt,t,scale) {
    if(dt>.28) return;
    const p=clamp(dt/.28), decay=Math.pow(1-p,1.45), flash=Math.exp(-dt*45);
    const half=5.3*scale*(1-.78*p);
    glow(ctx,x+length*.55,y,length*.53,15*scale,decay*.85);
    body(ctx,x,y,length,half,t,decay,.7);
    line(ctx,x,y,x+length,y,1.15*scale,P.core,flash*.85);
    for(let i=0;i<6;i++) {
      const u=(i/6+dt*1.6)%1;
      const yy=y+Math.sin(i*7.1)*(half+2*scale);
      streak(ctx,x+length*u,yy,18*scale,1,decay*.65,scale);
    }
    glow(ctx,x,y,(22-12*p)*scale,(12-6*p)*scale,decay*.7);
    glow(ctx,x+length,y,(21-8*p)*scale,(23-9*p)*scale,decay*.65);
    for(const sign of [-1,1]) {
      polygon(ctx,[[x-8*scale,y],[x+6*scale,y-sign*11*scale*(1-p)],[x+19*scale,y],[x+6*scale,y+sign*4*scale]],P.hot,flash*.8);
    }
  }
  function heavyShot(ctx,x,y,length,dt,t,scale) {
    const p=clamp(dt/shotDuration), flash=Math.exp(-dt*40);
    const collapse=ease(clamp((dt-.055)/.285));
    const decay=dt<.065?1:Math.pow(1-clamp((dt-.065)/.275),1.45);
    const half=(8.4+4.5*flash)*scale*(1-.92*collapse);
    glow(ctx,x+length*.52,y,length*.57,(24+12*flash)*scale,decay);
    body(ctx,x,y,length,half,t*1.4,decay,.95);
    line(ctx,x,y,x+length,y,(1.3+2.4*flash)*scale,P.core,decay*.9);
    for(let i=0;i<7;i++) {
      const u=(i*.143+dt*2.7)%1;
      const yy=y+Math.sin(i*7.1)*(half+3*scale);
      streak(ctx,x+u*length,yy,(21+9*flash)*scale,1,decay*.82,scale);
    }
    const shock=clamp(dt/.16), ringFade=Math.pow(1-shock,1.3);
    if(ringFade>0) {
      const r=(7+31*ease(shock))*scale;
      ctx.save();ctx.strokeStyle=P.mid;ctx.globalAlpha=ringFade*.85;ctx.lineWidth=(1+2*ringFade)*scale;
      for(const side of [-1,1]) {
        ctx.beginPath();ctx.ellipse(x-2*scale,y,r*.27,r,0,side>0?-.9:Math.PI-.9,side>0?.9:Math.PI+.9);ctx.stroke();
      }
      ctx.restore();
    }
    glow(ctx,x+3*scale,y,(39-20*p)*scale,(31-16*p)*scale,decay);
    const flare=Math.exp(-dt*18), reach=(27+16*flash)*scale;
    for(const sign of [-1,1]) {
      polygon(ctx,[[x-5*scale,y],[x+7*scale,y-sign*reach*.7],[x+12*scale,y-sign*reach*.25],[x+reach*.9,y-sign*reach*.32],[x+reach*.6,y],[x+reach,y+sign*reach*.18],[x+7*scale,y+sign*reach*.3]],P.rim,flare);
      polygon(ctx,[[x-2*scale,y],[x+8*scale,y-sign*reach*.4],[x+11*scale,y-sign*reach*.12],[x+reach*.7,y],[x+9*scale,y+sign*reach*.18]],P.hot,flare);
    }
    glow(ctx,x+length,y,(26-13*p)*scale,(30-15*p)*scale,decay*.9);
    for(let i=0;i<6;i++) {
      const angle=(i/6)*TAU+.18, r=(4+dt*110)*scale;
      const xx=x+length+Math.cos(angle)*r*.6, yy=y+Math.sin(angle)*r;
      line(ctx,xx,yy,xx+Math.cos(angle)*7*scale,yy+Math.sin(angle)*10*scale,Math.max(.6,1.1*scale),P.hot,Math.exp(-dt*13));
    }
  }
  function shot(ctx,x,y,length,dt,t,scale) {
    if(state.force==='heavy') heavyShot(ctx,x,y,length,dt,t,scale);
    else earlierShot(ctx,x,y,length,dt,t,scale);
  }
  function label(ctx,text,x,y,color='#9aaac2') {ctx.font='11px system-ui';ctx.fillStyle=color;ctx.fillText(text,x,y);}
  function drawCandidate(c) {
    const ctx=c.getContext('2d'),w=c.clientWidth,h=c.clientHeight,kind=c.dataset.kind;
    background(ctx,w,h,true);
    const q=clamp(state.time/chargeDuration),dt=state.time-chargeDuration;
    const recoil=state.force==='heavy' && dt>=0 ? 5*Math.exp(-dt*17)*Math.sin(clamp(dt/.04)*Math.PI*.5) : 0;
    const x=53,end=w-47,length=end-x,y=70;
    ship(ctx,x-17-recoil,y,.8);target(ctx,end+10,y,.78);
    if(dt<0) aim(ctx,x,y,length,q,state.time,kind,1.5);
    else if(dt<=shotDuration) shot(ctx,x,y,length,dt,state.time,1.5);
    label(ctx,'MUZZLE',14,18);ctx.textAlign='right';label(ctx,'TARGET',w-14,18);ctx.textAlign='left';
    line(ctx,14,125,w-14,125,.5,'#94acd0',.22);
    const smallLength=Math.min(150,w*.45),sx=43,sy=171;
    ship(ctx,sx-11-recoil*.3,sy,.48);target(ctx,sx+smallLength+7,sy,.5);
    if(dt<0) aim(ctx,sx,sy,smallLength,q,state.time,kind,.45);
    else if(dt<=shotDuration) shot(ctx,sx,sy,smallLength,dt,state.time,.45);
    label(ctx,'Small-scale check',14,203);
  }
  let previousPhase='';
  function drawAll() {
    for(const c of candidates) drawCandidate(c);
    time.value=state.time;
    const end=chargeDuration+(state.force==='heavy'?shotDuration:.28);
    const labelText=state.time<chargeDuration?'Charging '+Math.round(state.time/chargeDuration*100)+'%':state.time<chargeDuration+.055?'Burst':state.time<end?'Crackle + afterglow':'Recovery';
    if(labelText!==previousPhase){phase.textContent=labelText;previousPhase=labelText;}
    root.dataset.ready='true';
  }
  let last=performance.now();
  function frame(now) {
    if(!root.isConnected) return;
    if(state.playing) {
      state.time+=Math.min((now-last)/1000,.1)*state.speed;
      if(state.once && state.time>1.95) {state.time=1.95;state.playing=false;state.once=false;updateControls();}
      else state.time%=cycleDuration;
    }
    last=now;drawAll();requestAnimationFrame(frame);
  }
  sky.onload=drawAll;
  new ResizeObserver(resize).observe(root);
  resize();requestAnimationFrame(frame);
})();
</script>
