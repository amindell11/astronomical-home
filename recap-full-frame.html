<style>
#recap-full-frame .rf-controls { margin-bottom:12px; }
#recap-full-frame .rf-game { --rf-ink:#edf0ec; --rf-soft:#b2bdcf; --rf-line:#d6dfed40; --rf-paint:#e8e7d9; position:relative; isolation:isolate; height:606px; overflow:hidden; background:#061027; color:var(--rf-ink); color-scheme:dark; font:400 14px/1.4 Bahnschrift,"Arial Narrow","Segoe UI",sans-serif; }
#recap-full-frame .rf-game *, #recap-full-frame .rf-game *::before, #recap-full-frame .rf-game *::after { box-sizing:border-box; }
#recap-full-frame .rf-space { position:absolute; z-index:-2; inset:0; overflow:hidden; background:radial-gradient(ellipse at 91% 72%,#3c3e8177,transparent 40%),radial-gradient(ellipse at 17% 30%,#2e79a45e,transparent 28%),linear-gradient(149deg,#061025 18%,#102348 40%,#266984 44%,#162d59 49%,#080f2b 66%,#1c2859); }
#recap-full-frame .rf-star { position:absolute; border-radius:50%; background:#ecf1f6; }
#recap-full-frame .rf-rock { position:absolute; background:linear-gradient(130deg,#c2bca0 0 28%,#79766d 29% 46%,#4b4e60 47% 71%,#30394c 72%); clip-path:polygon(5% 33%,20% 10%,49% 0,72% 9%,94% 35%,100% 69%,76% 92%,41% 100%,12% 79%,0 57%); }
#recap-full-frame .rf-rock.a { width:112px; height:139px; right:4%; top:3%; transform:rotate(22deg); }
#recap-full-frame .rf-rock.b { width:84px; height:70px; left:26%; bottom:7%; transform:rotate(-38deg); }
#recap-full-frame .rf-rock.c { width:51px; height:72px; right:17%; bottom:25%; transform:rotate(19deg); }
#recap-full-frame .rf-scene-ship { position:absolute; width:48px; height:48px; left:72%; top:36%; transform:rotate(43deg); opacity:.65; background:#a5b7d3; mask-size:contain; mask-position:center; mask-repeat:no-repeat; }
#recap-full-frame .rf-panel { --rf-opacity:.9; position:absolute; left:7%; top:50%; transform:translateY(-50%); width:338px; padding:27px 28px; background:rgba(12,20,39,var(--rf-opacity)); }
#recap-full-frame .rf-panel::before { content:""; position:absolute; top:0; left:0; width:17px; height:17px; border:solid #e9edf16e; border-width:1px 0 0 1px; }
#recap-full-frame .rf-outcome { font:400 40px/1.1 Bahnschrift,"Arial Narrow","Segoe UI",sans-serif; letter-spacing:1.8px; margin:0 0 29px; white-space:nowrap; color:#e89594; }
#recap-full-frame .rf-game[data-result="win"] .rf-outcome { color:#8fd4aa; }
#recap-full-frame .rf-tally-label { display:flex; align-items:baseline; gap:9px; color:var(--rf-soft); font-size:11px; line-height:20px; letter-spacing:1.7px; margin-bottom:12px; }
#recap-full-frame .rf-count { color:var(--rf-ink); font-size:17px; letter-spacing:.5px; }
#recap-full-frame .rf-trophies { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:6px 8px; }
#recap-full-frame .rf-mark { position:relative; display:grid; place-items:center; height:40px; min-width:0; border:0; padding:0; background:transparent; color:var(--rf-paint); }
#recap-full-frame .rf-mark::before { content:""; width:34px; height:34px; background:currentColor; transform:rotate(var(--rf-tilt,0deg)); mask-image:var(--rf-ship); mask-size:contain; mask-position:center; mask-repeat:no-repeat; }
#recap-full-frame .rf-mark:hover { color:#fff; }
#recap-full-frame .rf-mark[aria-pressed="true"] { background:#bbc8df13; }
#recap-full-frame .rf-detail { height:17px; margin-top:8px; color:var(--rf-soft); font-size:11px; line-height:17px; letter-spacing:.8px; }
#recap-full-frame .rf-progress { border-top:1px solid var(--rf-line); padding-top:18px; margin-top:11px; }
#recap-full-frame .rf-distance { color:var(--rf-soft); font-size:11px; letter-spacing:1.4px; line-height:16px; margin-bottom:13px; }
#recap-full-frame .rf-route { display:flex; align-items:center; gap:10px; }
#recap-full-frame .rf-node { position:relative; display:grid; place-items:center; width:26px; height:26px; flex-shrink:0; font-size:11px; letter-spacing:.5px; }
#recap-full-frame .rf-node::before { content:""; position:absolute; inset:0; border-radius:50%; background:#a7bbcf20; }
#recap-full-frame .rf-node.rf-reached { color:#edba9d; }
#recap-full-frame .rf-node.rf-reached::before { border:1px solid #e2b69588; border-top-color:transparent; background:none; transform:rotate(-30deg); }
#recap-full-frame .rf-path { flex:1; height:1px; background:#c4d1e64a; }
#recap-full-frame .rf-continue { display:flex; align-items:center; gap:29px; margin-top:24px; padding:10px 16px; min-height:38px; border:1px solid #e4e8ec80; color:var(--rf-ink); background:transparent; font:400 11px/1.2 Bahnschrift,"Arial Narrow","Segoe UI",sans-serif; letter-spacing:2px; }
#recap-full-frame .rf-continue span { font-size:18px; line-height:12px; }
#recap-full-frame .rf-continue:hover { background:#d8e1f111; border-color:#edf0ec; }
</style>
<style>

#recap-full-frame .rf-time-value { font-size:24px; letter-spacing:1px; font-variant-numeric:tabular-nums; }
#recap-full-frame .rf-continue .rf-action-label { font-size:11px; line-height:1.2; }
#recap-full-frame .rf-progress { margin-top:18px; }
#recap-full-frame .rf-board { box-sizing:border-box; width:292px; padding:30px 22px 26px; background:rgba(12,20,39,.9); color:var(--rf-ink); }

#recap-full-frame .rf-board-heading { font:400 16px/1.3 Bahnschrift,"Arial Narrow","Segoe UI",sans-serif; letter-spacing:2px; margin:2px 0 7px; }
#recap-full-frame .rf-board-rank { font-size:11px; color:var(--rf-soft); letter-spacing:.7px; margin-bottom:29px; }
#recap-full-frame .rf-table { width:100%; border-collapse:collapse; font-size:12px; font-variant-numeric:tabular-nums; }
#recap-full-frame .rf-table th { text-align:right; font-size:11px; font-weight:400; color:var(--rf-soft); padding:0 0 12px 9px; }
#recap-full-frame .rf-table th:first-child { text-align:left; padding-left:0; }
#recap-full-frame .rf-table td { padding:13px 0 13px 9px; text-align:right; vertical-align:middle; border-top:1px solid #d6dfed20; }
#recap-full-frame .rf-table td:first-child { text-align:left; padding-left:0; }
#recap-full-frame .rf-table small { display:block; font-size:11px; color:var(--rf-soft); margin-top:4px; white-space:nowrap; }
#recap-full-frame .rf-table tr.rf-current { background:#8fd4aa0d; }
#recap-full-frame .rf-table tr.rf-current td:first-child { color:#8fd4aa; }
#recap-full-frame .rf-game[data-mode="defeat"] .rf-table tr.rf-current { background:#e895940d; }
#recap-full-frame .rf-game[data-mode="defeat"] .rf-table tr.rf-current td:first-child { color:#e89594; }
#recap-full-frame .rf-rank-number { display:inline-block; min-width:21px; color:var(--rf-soft); }
</style>

<script>
(() => {

 const textures=JSON.parse(document.getElementById('sector-recap-assets').textContent);

 const sectorKills=runKills.slice(5,12);
 const game=root.querySelector('.rf-game');
 const frame=root.querySelector('.rf-frame');
 const resizeFrame=()=>game.style.setProperty('--rf-frame-scale',String(frame.clientWidth/1280));
 new ResizeObserver(resizeFrame).observe(frame);
 resizeFrame();
 let mode='defeat',selected=-1;
 function restore(saved){mode=['sector','victory','defeat'].includes(saved?.mode)?saved.mode:'defeat';const kills=mode==='sector'?sectorKills:runKills;selected=Number.isInteger(saved?.selected)&&saved.selected>=0&&saved.selected<kills.length?saved.selected:-1;}
 restore(window.openai?.widgetState?.modelContent);
 function persist(){window.openai?.setWidgetState?.({modelContent:{mode,selected,selectedShip:(mode==='sector'?sectorKills:runKills)[selected]??null},privateContent:null})?.catch?.(()=>{});}
 function render(){
  const runEnded=mode!=='sector',defeat=mode==='defeat',kills=runEnded?runKills:sectorKills;

  game.querySelector('.rf-outcome').textContent=defeat?'SHIP LOST':runEnded?'VICTORY':'EXTRACTED';
  game.querySelector('.rf-context').hidden=runEnded;
  game.querySelector('.rf-count').textContent=kills.length;
  game.querySelector('.rf-time').hidden=runEnded;
  game.querySelector('.rf-progress').hidden=!runEnded;
  game.querySelector('.rf-board').hidden=!runEnded;
  game.querySelector('.rf-action-label').textContent=runEnded?'RETURN TO HANGAR':'NEXT SECTOR';
  game.querySelector('.rf-distance').textContent=defeat?'2 SECTORS CLEARED':'3 SECTORS CLEARED';
  game.querySelectorAll('.rf-node').forEach((node,index)=>{const reached=defeat&&index===2;node.classList.toggle('rf-reached',reached);node.setAttribute('aria-label',`Sector ${index+1} ${reached?'reached':'cleared'}`);});
  const current={label:'This run',sectors:defeat?2:3,kills:17,time:'11:26',current:true};
  const scores=[{label:'Oct 19',sectors:3,kills:24,time:'14:08'},{label:'Oct 20',sectors:3,kills:19,time:'12:35'},{label:'Oct 18',sectors:3,kills:15,time:'13:12'},{label:'Oct 20',sectors:2,kills:20,time:'09:44'},current].sort((a,b)=>b.sectors-a.sectors||b.kills-a.kills);
  const rank=scores.indexOf(current)+1;
  game.querySelector('.rf-board-rank').textContent=`Your best runs · ${rank===3?'3rd':'5th'} of 12`;
  const body=game.querySelector('.rf-table tbody');body.replaceChildren();
  scores.forEach((score,index)=>{
   const row=document.createElement('tr');if(score.current)row.className='rf-current';
   const name=document.createElement('td'),position=document.createElement('span');position.className='rf-rank-number';position.textContent=index+1;name.append(position,document.createTextNode(score.label));row.append(name);
   [score.sectors,score.kills,score.time].forEach(value=>{const cell=document.createElement('td');cell.textContent=value;row.append(cell);});body.append(row);
  });
  const grid=game.querySelector('.rf-trophies');
  grid.setAttribute('aria-label',runEnded?'Confirmed kills for the whole run':'Confirmed kills in this sector');
  grid.replaceChildren();
  kills.forEach((name,index)=>{
   const mark=document.createElement('button');mark.type='button';mark.className='rf-mark cursor-interaction';mark.style.setProperty('--rf-ship',`url("${textures[name]}")`);mark.setAttribute('aria-label',`${name}, confirmed kill ${index+1}`);mark.setAttribute('aria-pressed',String(index===selected));
   mark.addEventListener('click',()=>{selected=selected===index?-1:index;render();persist();});grid.append(mark);
  });
  game.querySelector('.rf-detail').textContent=selected>=0?`${kills[selected]} destroyed`:'';
 }
 const space=game.querySelector('.rf-space');
 for(let i=0;i<95;i++){
  const star=document.createElement('i');star.className='rf-star';star.style.cssText=`left:${(i*67.31)%100}%;top:${(i*43.77)%100}%;width:${i%13===0?2:1}px;height:${i%13===0?2:1}px;opacity:${.2+(i%5)*.13}`;space.append(star);
 }
 ['a','b','c'].forEach(name=>{const rock=document.createElement('i');rock.className=`rf-rock ${name}`;space.append(rock);});
 const sceneShip=document.createElement('i');sceneShip.className='rf-scene-ship';sceneShip.style.maskImage=`url("${textures.Valis}")`;space.append(sceneShip);
 const route=game.querySelector('.rf-route');
 ['01','02','03'].forEach((num,index)=>{if(index){const path=document.createElement('span');path.className='rf-path';path.setAttribute('aria-hidden','true');route.append(path);}const node=document.createElement('span');node.className='rf-node';node.textContent=num;node.setAttribute('aria-label',`Sector ${index+1} cleared`);route.append(node);});
 root.querySelectorAll('[data-preview]').forEach(button=>button.addEventListener('click',()=>{mode=button.dataset.preview;selected=-1;render();persist();}));
 game.querySelector('.rf-continue').addEventListener('click',()=>{game.querySelector('.rf-detail').textContent=mode==='sector'?'Continue to sector 03':'Return to the hangar';});
 window.addEventListener('openai:set_globals',event=>{const saved=event.detail?.globals?.widgetState?.modelContent;if(!saved)return;restore(saved);render();});
 render();
 if(globalThis.Tweak){
  const panel=game.querySelector('.rf-panel'),state={backing:90};
  const tweak=new Tweak({container:panel,onChange:()=>panel.style.setProperty('--rf-opacity',String(state.backing/100))});
  tweak.addSlider(state,'backing',{label:'Backing opacity',min:55,max:100,step:1,unit:'%'});
 }
})();
</script>
