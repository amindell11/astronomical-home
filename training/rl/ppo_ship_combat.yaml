behaviors:
  ShipCombat:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 3.0e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.98
      num_epoch: 3
      learning_rate_schedule: linear
      # Unset, beta inherits the linear LR schedule and anneals to ~0 — run 1's late policy
      # collapse onto the passive mean. Held constant so exploration never fully closes.
      beta_schedule: constant
    network_settings:
      normalize: false
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99  # must equal RewardSpec.Default.gamma (Ng-shaping soundness); pinned by RLTrainerConfigEditModeTests
        strength: 1.0
    # 3.5M steps / 100k interval = 35 checkpoints + final: selection must cover the whole run, not the tail.
    keep_checkpoints: 36
    checkpoint_interval: 100000
    # 2M landed mid-learning-curve (eval 33/60 at 2M → 57/60 by 3.4M on this recipe). The extra
    # budget must buy TERMINAL consolidation, not a longer curriculum, so every progress
    # threshold below is scaled by 2/3.5 and keeps the absolute step it had under the 2M cap.
    max_steps: 3500000
    time_horizon: 64
    summary_freq: 6000
# Curriculum. Param names ↔ EnvParamOverlay consts, lesson-0 values, and the terminal density
# band are pinned by RLTrainerConfigEditModeTests. Thresholds re-grounded 2026-07-20 for the
# time-cost reward (RewardSpec.timeCostPerDecision drags every episode −0.1..−0.6); ceiling
# calibration: sustained post-cost reward ~0.85 at density 1.5, so every gate below ~0.7 is
# reachable — a stalled gate strands the run, an early gate just adds consolidation.
# Staging (2026-07-25): dummy-ignition → archetype ladder at LOW density → consolidation hold
# → density band + lethality ramp to the terminal spread. Every phase keeps rocks on the field.
environment_parameters:
  # NEVER curriculum this flag: field composition is boot-frozen (TrainingHost composes once;
  # a mid-run flip wedges every worker — observed twice).
  use_asteroid_field: 1.0
  # DENSITY NEVER REACHES ZERO (2026-07-25). The stage (ii) obstacle BufferSensor makes an
  # empty arena actively harmful: 600k steps with zero observables taught the attention layer
  # a single "buffer is non-empty" bias instead of how to read tokens, and populating it at
  # 600k collapsed the policy across every archetype — damage vs the STATIONARY dummy fell
  # 85.3 → 6.1 with zero collisions taken. ONNX probe on that checkpoint: 8 rocks at the arena
  # edge moved the action vector ~2× harder than losing the target entirely (mean |Δ| 0.207 vs
  # 0.108), while 1 rock vs 32 was noise (0.029) — occupancy, not content. The low-density
  # teacher phase replaces the old empty phase: few enough rocks that fights stay clean,
  # never so few that attention sees nothing.
  #
  # Lanes gate on REWARD with a min_lesson_length floor, not on absolute steps. Steps failed
  # in the other direction: the density lane was anchored at 600k assuming warm-start ignition
  # (<50k), cold-start ignition took 558k, and the teacher phase got squeezed to 42k.
  # min_lesson_length is the anti-squeeze floor (episodes since the last lesson change on ANY
  # lane — the buffer clears globally, trainer_controller.py:220); the reward threshold only
  # blocks advancing while the policy is broken, so it is set LOW on purpose. Do not raise it
  # toward the ~0.7 reachable ceiling: the global mean is composition-polluted (a dummy-heavy
  # phase inflates it, Evader draws at ~-2.0 drag it down), so a high gate strands the run.
  #
  # min_lesson_length IS GLOBAL, NOT PER-LANE. get_minimum_reward_buffer_size() takes the MAX
  # across every lane's lessons and makes that the reward deque's maxlen; need_increment then
  # averages the WHOLE deque. So the largest min_lesson_length here sets the averaging window
  # for EVERY gate. Observed 2026-07-25: a 2400 on lethality_soft held the dummy lane at the
  # ignition lesson while recent episodes averaged +0.73, because the 2400-episode window still
  # carried the run's early -3.0 episodes (806-ep mean -0.449 vs last-150 mean +0.748).
  # Keep the max here near the longest hold you actually want (1200), never far above it.
  field_density_scale:
    curriculum:
      # Lesson values are samplers (mlagents Lesson.value = ParameterRandomizationSettings);
      # a constant lesson mixed into a sampler-valued curriculum breaks the env handshake at
      # boot (bisect-proven 2026-07-24), so every lesson here stays a sampler.
      - name: density_low_teacher
        completion_criteria:
          measure: reward
          behavior: ShipCombat
          signal_smoothing: false
          min_lesson_length: 300
          threshold: 0.25
        value:
          sampler_type: uniform
          sampler_parameters:
            min_value: 0.1
            max_value: 0.3
      # Same density as above: holds ~1200 episodes PAST the competence threshold, so the
      # archetype ladder consolidates before the field thickens (the #215 lesson — the 33/60
      # → 57/60 gain came from consolidating after reaching a level, not from reaching it).
      - name: density_low_hold
        completion_criteria:
          measure: reward
          behavior: ShipCombat
          signal_smoothing: false
          min_lesson_length: 1200
          threshold: 0.25
        value:
          sampler_type: uniform
          sampler_parameters:
            min_value: 0.1
            max_value: 0.3
      - name: density_sparse
        completion_criteria:
          measure: reward
          behavior: ShipCombat
          signal_smoothing: false
          min_lesson_length: 900
          threshold: 0.30
        value:
          sampler_type: uniform
          sampler_parameters:
            min_value: 0.1
            max_value: 1.0
      - name: density_mid
        completion_criteria:
          measure: reward
          behavior: ShipCombat
          signal_smoothing: false
          min_lesson_length: 900
          threshold: 0.35
        value:
          sampler_type: uniform
          sampler_parameters:
            min_value: 0.25
            max_value: 1.75
      - name: density_full
        value:
          sampler_type: uniform
          sampler_parameters:
            min_value: 0.5
            max_value: 2.5
  # Staggered behind density by a longer floor, same reward-gate reasoning. The floor must
  # stay strictly above density_sparse's 900: the buffer clears on any lane's advance, so an
  # equal floor+threshold makes both lanes fire on the same gate check (observed co-fire).
  collision_lethality:
    curriculum:
      - name: lethality_soft
        completion_criteria:
          measure: reward
          behavior: ShipCombat
          signal_smoothing: false
          min_lesson_length: 1200
          threshold: 0.30
        value: 0.25
      - name: lethality_mid
        completion_criteria:
          measure: reward
          behavior: ShipCombat
          signal_smoothing: false
          min_lesson_length: 1200
          threshold: 0.35
        value: 0.5
      - name: lethality_full
        value: 1.0
  opponent_weight_aggressor: 0.4
  opponent_weight_evader: 0.2
  opponent_weight_orbiter: 0.15
  opponent_weight_kiter: 0.15
  opponent_weight_dummy:
    curriculum:
      # Weights normalize by sum (OpponentRoster.Pick): 8.0 vs the armed 0.9 ≈ 90% Dummy.
      # Ignition lesson for the manual-aim gradient chain — the 500k gate run fired 0 shots
      # at a stationary Dummy; approach→aim→fire→hit must first pay against a harmless target.
      - name: dummy_bootstrap
        completion_criteria:
          measure: reward
          behavior: ShipCombat
          signal_smoothing: true
          min_lesson_length: 300
          threshold: 0.2
        value: 8.0
      - name: dummy_floor
        completion_criteria:
          measure: reward
          behavior: ShipCombat
          signal_smoothing: true
          min_lesson_length: 300
          threshold: 0.3
        value: 0.4
      - name: dummy_mid
        completion_criteria:
          measure: reward
          behavior: ShipCombat
          signal_smoothing: true
          min_lesson_length: 300
          threshold: 0.5
        value: 0.25
      - name: dummy_final
        value: 0.1
  # Sentence vocabulary: RELEASED FROM STEP 0 (user ruling 2026-08-26, amending fork 5's
  # pinned phase). A branch masked to one choice saturates its softmax and gets ZERO gradient,
  # so the pinned phase left referent/frame heads at random init; releasing them at ~500k
  # collapsed attempt 1 (wins/300eps 167→0 — the action-space twin of the empty-buffer
  # occupancy-bias failure). The key stays present for the EnvParamOverlay key-equivalence pin;
  # ABSENT = RELEASED is the eval/self-play default, so 1.0 here matches those envs.
  sentence_release: 1.0
# Pacing contract: one rendered frame advances exactly one 50 Hz fixed step (mlagents defaults time_scale 20 / capture 60 violate it); pinned by test + TrainingHost runtime assert.
# PPO updates + worker policy serving on the RTX 2000 Ada (user ruling 2026-08-27); the
# shared venv carries torch cu121, and explicit beats mlagents' cuda-if-available default.
torch_settings:
  device: cuda
engine_settings:
  width: 320
  height: 240
  quality_level: 1
  time_scale: 1
  target_frame_rate: -1
  capture_frame_rate: 50
env_settings:
  # Editor boot + play-mode domain reload (Burst) outlasts the 60 s default handshake window.
  timeout_wait: 300
checkpoint_settings:
  run_id: ship_combat
  results_dir: ../../results/rl-training
