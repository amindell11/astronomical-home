behaviors:
  ShipCombat:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 3.0e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: false
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99  # must equal RewardSpec.Default.gamma (Ng-shaping soundness); pinned by RLTrainerConfigEditModeTests
        strength: 1.0
    # 2M steps / 100k interval = 20 checkpoints + final: selection must cover the whole run, not the tail.
    keep_checkpoints: 21
    checkpoint_interval: 100000
    max_steps: 2000000
    time_horizon: 64
    summary_freq: 6000
# Curriculum. Param names ↔ EnvParamOverlay consts and lesson-0 values are pinned by
# RLTrainerConfigEditModeTests. Thresholds finalized 2026-07-19 from the pilot's reward curve
# (crosses 0.3 ~20k steps, plateau 1.9; ladder tops out at ~55% of plateau to absorb
# mixture-opponent + asteroid depression); staging order rides the ascending thresholds
# (dummy decay → lethality ramp → density ramp).
environment_parameters:
  use_asteroid_field: 1.0
  field_density_scale:
    curriculum:
      - name: density_baseline
        completion_criteria:
          measure: reward
          behavior: ShipCombat
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 0.6
        value: 1.0
      - name: density_mid
        completion_criteria:
          measure: reward
          behavior: ShipCombat
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 1.05
        value: 1.5
      - name: density_full
        value: 2.0
  collision_lethality:
    curriculum:
      - name: lethality_soft
        completion_criteria:
          measure: reward
          behavior: ShipCombat
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 0.45
        value: 0.25
      - name: lethality_mid
        completion_criteria:
          measure: reward
          behavior: ShipCombat
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 0.9
        value: 0.5
      - name: lethality_full
        value: 1.0
  opponent_weight_aggressor: 0.4
  opponent_weight_evader: 0.2
  opponent_weight_orbiter: 0.15
  opponent_weight_kiter: 0.15
  opponent_weight_dummy:
    curriculum:
      - name: dummy_floor
        completion_criteria:
          measure: reward
          behavior: ShipCombat
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 0.3
        value: 0.4
      - name: dummy_mid
        completion_criteria:
          measure: reward
          behavior: ShipCombat
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 0.75
        value: 0.25
      - name: dummy_final
        value: 0.1
# Pacing contract: one rendered frame advances exactly one 50 Hz fixed step (mlagents defaults time_scale 20 / capture 60 violate it); pinned by test + TrainingHost runtime assert.
engine_settings:
  width: 320
  height: 240
  quality_level: 1
  time_scale: 1
  target_frame_rate: -1
  capture_frame_rate: 50
env_settings:
  # Editor boot + play-mode domain reload (Burst) outlasts the 60 s default handshake window.
  timeout_wait: 300
checkpoint_settings:
  run_id: ship_combat
  results_dir: ../../results/rl-training
