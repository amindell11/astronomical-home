behaviors:
  ShipCombat:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 3.0e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.98
      num_epoch: 3
      learning_rate_schedule: linear
      # Unset, beta inherits the linear LR schedule and anneals to ~0 — run 1's late policy
      # collapse onto the passive mean. Held constant so exploration never fully closes.
      beta_schedule: constant
    network_settings:
      normalize: false
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99  # must equal RewardSpec.Default.gamma (Ng-shaping soundness); pinned by RLTrainerConfigEditModeTests
        strength: 1.0
    # 3.5M steps / 100k interval = 35 checkpoints + final: selection must cover the whole run, not the tail.
    keep_checkpoints: 36
    checkpoint_interval: 100000
    # 2M landed mid-learning-curve (eval 33/60 at 2M → 57/60 by 3.4M on this recipe). The extra
    # budget must buy TERMINAL consolidation, not a longer curriculum, so every progress
    # threshold below is scaled by 2/3.5 and keeps the absolute step it had under the 2M cap.
    max_steps: 3500000
    time_horizon: 64
    summary_freq: 6000
# Curriculum. Param names ↔ EnvParamOverlay consts, lesson-0 values, and the terminal density
# band are pinned by RLTrainerConfigEditModeTests. Thresholds re-grounded 2026-07-20 for the
# time-cost reward (RewardSpec.timeCostPerDecision drags every episode −0.1..−0.6); ceiling
# calibration: sustained post-cost reward ~0.85 at density 1.5, so every gate below ~0.7 is
# reachable — a stalled gate strands the run, an early gate just adds consolidation.
# Manual-aim staging (2026-07-24): dummy-ignition → archetype ladder in an EMPTY arena →
# field arrives sparse at +0.55 → density band + lethality ramp to the terminal spread.
environment_parameters:
  # Env lanes are SCHEDULED (measure: progress, fraction of max_steps), not reward-gated:
  # every reward gate reads the same global mean, and a dummy-heavy phase inflates it past
  # any env threshold (observed twice — the gates tripped in minutes regardless of window).
  # Opponent lanes stay reward-adaptive; the env follows the intended timetable: empty arena
  # for the first 600k steps, then the field arrives sparse and density/lethality ramp, staggered.
  # Thresholds are annotated in absolute steps — they are anchored there, not to round fractions;
  # if max_steps moves again, rescale them all so the absolute timetable survives.
  # NEVER curriculum this flag: field composition is boot-frozen (TrainingHost composes once;
  # a mid-run flip wedges every worker — observed twice). The empty-arena phase is density 0.
  use_asteroid_field: 1.0
  field_density_scale:
    curriculum:
      # Lesson values are samplers (mlagents Lesson.value = ParameterRandomizationSettings).
      # density_empty IS the fieldless phase: field composed, zero rocks. Expressed as a
      # degenerate sampler: a constant lesson mixed into a sampler-valued curriculum breaks
      # the env handshake at boot (bisect-proven 2026-07-24).
      - name: density_empty
        completion_criteria:
          measure: progress
          behavior: ShipCombat
          signal_smoothing: false
          min_lesson_length: 300
          threshold: 0.171  # 600k steps
        value:
          sampler_type: uniform
          sampler_parameters:
            min_value: 0.0
            max_value: 0.0001
      - name: density_sparse
        completion_criteria:
          measure: progress
          behavior: ShipCombat
          signal_smoothing: false
          min_lesson_length: 300
          threshold: 0.257  # 900k steps
        value:
          sampler_type: uniform
          sampler_parameters:
            min_value: 0.0
            max_value: 1.0
      - name: density_mid
        completion_criteria:
          measure: progress
          behavior: ShipCombat
          signal_smoothing: false
          min_lesson_length: 300
          threshold: 0.343  # 1.2M steps
        value:
          sampler_type: uniform
          sampler_parameters:
            min_value: 0.25
            max_value: 1.75
      - name: density_full
        value:
          sampler_type: uniform
          sampler_parameters:
            min_value: 0.5
            max_value: 2.5
  collision_lethality:
    curriculum:
      - name: lethality_soft
        completion_criteria:
          measure: progress
          behavior: ShipCombat
          signal_smoothing: false
          min_lesson_length: 300
          threshold: 0.286  # 1.0M steps
        value: 0.25
      - name: lethality_mid
        completion_criteria:
          measure: progress
          behavior: ShipCombat
          signal_smoothing: false
          min_lesson_length: 300
          threshold: 0.371  # 1.3M steps
        value: 0.5
      - name: lethality_full
        value: 1.0
  opponent_weight_aggressor: 0.4
  opponent_weight_evader: 0.2
  opponent_weight_orbiter: 0.15
  opponent_weight_kiter: 0.15
  opponent_weight_dummy:
    curriculum:
      # Weights normalize by sum (OpponentRoster.Pick): 8.0 vs the armed 0.9 ≈ 90% Dummy.
      # Ignition lesson for the manual-aim gradient chain — the 500k gate run fired 0 shots
      # at a stationary Dummy; approach→aim→fire→hit must first pay against a harmless target.
      - name: dummy_bootstrap
        completion_criteria:
          measure: reward
          behavior: ShipCombat
          signal_smoothing: true
          min_lesson_length: 300
          threshold: 0.2
        value: 8.0
      - name: dummy_floor
        completion_criteria:
          measure: reward
          behavior: ShipCombat
          signal_smoothing: true
          min_lesson_length: 300
          threshold: 0.3
        value: 0.4
      - name: dummy_mid
        completion_criteria:
          measure: reward
          behavior: ShipCombat
          signal_smoothing: true
          min_lesson_length: 300
          threshold: 0.5
        value: 0.25
      - name: dummy_final
        value: 0.1
# Pacing contract: one rendered frame advances exactly one 50 Hz fixed step (mlagents defaults time_scale 20 / capture 60 violate it); pinned by test + TrainingHost runtime assert.
engine_settings:
  width: 320
  height: 240
  quality_level: 1
  time_scale: 1
  target_frame_rate: -1
  capture_frame_rate: 50
env_settings:
  # Editor boot + play-mode domain reload (Burst) outlasts the 60 s default handshake window.
  timeout_wait: 300
checkpoint_settings:
  run_id: ship_combat
  results_dir: ../../results/rl-training
