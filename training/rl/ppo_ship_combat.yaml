behaviors:
  ShipCombat:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 3.0e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
      # Unset, beta inherits the linear LR schedule and anneals to ~0 — run 1's late policy
      # collapse onto the passive mean. Held constant so exploration never fully closes.
      beta_schedule: constant
    network_settings:
      normalize: false
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99  # must equal RewardSpec.Default.gamma (Ng-shaping soundness); pinned by RLTrainerConfigEditModeTests
        strength: 1.0
    # 2M steps / 100k interval = 20 checkpoints + final: selection must cover the whole run, not the tail.
    keep_checkpoints: 21
    checkpoint_interval: 100000
    max_steps: 2000000
    time_horizon: 64
    summary_freq: 6000
# Curriculum. Param names ↔ EnvParamOverlay consts, lesson-0 values, and the density sampler
# range are pinned by RLTrainerConfigEditModeTests. Thresholds re-grounded 2026-07-20 for the
# time-cost reward (RewardSpec.timeCostPerDecision drags every episode −0.1..−0.6): the
# 2026-07-19 ladder rescaled ×0.65 so the top gate clears the estimated post-cost
# density-1.5 band (~0.85) — a stalled gate strands the run, an early gate just adds
# terminal-env consolidation. Staging order rides the ascending thresholds
# (dummy decay → lethality ramp). Density is a per-episode uniform sampler from step 0
# (stage (i)′ decision: the ramp's strict recipe-cloning purpose died with the manual-aim
# interface change; a spread trains one policy across the whole density band).
environment_parameters:
  use_asteroid_field: 1.0
  field_density_scale:
    sampler_type: uniform
    sampler_parameters:
      min_value: 0.5
      max_value: 2.5
  collision_lethality:
    curriculum:
      - name: lethality_soft
        completion_criteria:
          measure: reward
          behavior: ShipCombat
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 0.3
        value: 0.25
      - name: lethality_mid
        completion_criteria:
          measure: reward
          behavior: ShipCombat
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 0.6
        value: 0.5
      - name: lethality_full
        value: 1.0
  opponent_weight_aggressor: 0.4
  opponent_weight_evader: 0.2
  opponent_weight_orbiter: 0.15
  opponent_weight_kiter: 0.15
  opponent_weight_dummy:
    curriculum:
      - name: dummy_floor
        completion_criteria:
          measure: reward
          behavior: ShipCombat
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 0.2
        value: 0.4
      - name: dummy_mid
        completion_criteria:
          measure: reward
          behavior: ShipCombat
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 0.5
        value: 0.25
      - name: dummy_final
        value: 0.1
# Pacing contract: one rendered frame advances exactly one 50 Hz fixed step (mlagents defaults time_scale 20 / capture 60 violate it); pinned by test + TrainingHost runtime assert.
engine_settings:
  width: 320
  height: 240
  quality_level: 1
  time_scale: 1
  target_frame_rate: -1
  capture_frame_rate: 50
env_settings:
  # Editor boot + play-mode domain reload (Burst) outlasts the 60 s default handshake window.
  timeout_wait: 300
checkpoint_settings:
  run_id: ship_combat
  results_dir: ../../results/rl-training
