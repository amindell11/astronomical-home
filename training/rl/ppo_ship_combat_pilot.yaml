# ~200k-step pilot: measures real steps/sec + confirms learning signal before committing to a full run.
# Differs from ppo_ship_combat.yaml in max_steps/run_id/keep_checkpoints AND carries no
# environment_parameters — it trains at the EnvParamOverlay defaults, not the curriculum, so its
# reward curve is a throughput/liveness signal only and is not comparable to a curriculum run's.
behaviors:
  ShipCombat:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 3.0e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.98
      num_epoch: 3
      learning_rate_schedule: linear
      beta_schedule: constant
    network_settings:
      normalize: false
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99  # must equal RewardSpec.Default.gamma (Ng-shaping soundness); pinned by RLTrainerConfigEditModeTests
        strength: 1.0
    keep_checkpoints: 3
    checkpoint_interval: 100000
    max_steps: 200000
    time_horizon: 64
    summary_freq: 6000
# Pacing contract: one rendered frame advances exactly one 50 Hz fixed step (mlagents defaults time_scale 20 / capture 60 violate it); pinned by test + TrainingHost runtime assert.
# device pin is load-bearing: the shared venv carries torch cu121 and mlagents defaults to
# cuda-if-available, which measured 50-55 steps/s vs CPU 89 on this net (2026-08-27).
torch_settings:
  device: cpu
engine_settings:
  width: 320
  height: 240
  quality_level: 1
  time_scale: 1
  target_frame_rate: -1
  capture_frame_rate: 50
env_settings:
  # Editor boot + play-mode domain reload (Burst) outlasts the 60 s default handshake window.
  timeout_wait: 300
checkpoint_settings:
  run_id: ship_combat_pilot
  results_dir: ../../results/rl-training
