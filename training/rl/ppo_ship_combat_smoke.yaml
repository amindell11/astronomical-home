# Trainer-connected smoke minting the eval-fixture checkpoint — tiny buffers/steps, NOT a training config; gamma and engine_settings must stay identical to ppo_ship_combat.yaml.
behaviors:
  ShipCombat:
    trainer_type: ppo
    hyperparameters:
      batch_size: 256
      buffer_size: 1024
      learning_rate: 3.0e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: false
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99  # must equal RewardSpec.Default.gamma (Ng-shaping soundness); pinned by RLTrainerConfigEditModeTests
        strength: 1.0
    keep_checkpoints: 2
    checkpoint_interval: 2000
    max_steps: 4000
    time_horizon: 64
    summary_freq: 500
engine_settings:
  width: 320
  height: 240
  quality_level: 1
  time_scale: 1
  target_frame_rate: -1
  capture_frame_rate: 50
env_settings:
  # Editor boot + play-mode domain reload (Burst) outlasts the 60 s default handshake window.
  timeout_wait: 300
checkpoint_settings:
  run_id: ship_combat_smoke
  results_dir: ../../results/rl-training
