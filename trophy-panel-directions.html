<style>
#trophy-directions { width:100%; }
#trophy-directions .game { --ink:#edf0ec; --soft:#b0bac9; --line:#d6dfed47; --navy:rgba(12,20,39,.89); --paint:#e8e7d9; position:relative; isolation:isolate; width:100%; height:576px; overflow:hidden; color:var(--ink); color-scheme:dark; font-family:Bahnschrift,"Arial Narrow","Segoe UI",sans-serif; font-weight:400; background:#061027; }
#trophy-directions .game *, #trophy-directions .game *::before, #trophy-directions .game *::after { box-sizing:border-box; }
#trophy-directions .space { position:absolute; z-index:-2; inset:0; overflow:hidden; background:radial-gradient(ellipse at 91% 72%,#3c3e8177,transparent 40%),radial-gradient(ellipse at 17% 30%,#2e79a45e,transparent 28%),linear-gradient(149deg,#061025 18%,#102348 40%,#266984 44%,#162d59 49%,#080f2b 66%,#1c2859); }
#trophy-directions .space::before { content:""; position:absolute; inset:-35%; transform:rotate(-24deg); background:radial-gradient(ellipse at 36% 48%,#4fabc94a,transparent 18%),radial-gradient(ellipse at 62% 44%,#7792c73d,transparent 20%); filter:blur(16px); }
#trophy-directions .star { position:absolute; background:#ecf1f6; border-radius:50%; }
#trophy-directions .rock { position:absolute; background:linear-gradient(130deg,#c2bca0 0 28%,#79766d 29% 46%,#4b4e60 47% 71%,#30394c 72%); clip-path:polygon(5% 33%,20% 10%,49% 0,72% 9%,94% 35%,100% 69%,76% 92%,41% 100%,12% 79%,0 57%); filter:drop-shadow(4px 5px 0 #020916); }
#trophy-directions .rock.a { width:112px; height:139px; right:4%; top:3%; transform:rotate(22deg); }
#trophy-directions .rock.b { width:84px; height:70px; left:23%; bottom:9%; transform:rotate(-38deg); }
#trophy-directions .rock.c { width:51px; height:72px; right:17%; bottom:25%; transform:rotate(19deg); }
#trophy-directions .rock.d { width:36px; height:41px; left:9%; top:16%; }
#trophy-directions .scene-ship { position:absolute; width:48px; height:48px; left:72%; top:36%; transform:rotate(43deg); opacity:.7; background:#a5b7d3; mask-size:contain; mask-position:center; mask-repeat:no-repeat; }
#trophy-directions .scene-ship::after { content:""; position:absolute; inset:10px 20px; background:#e5a377; }
#trophy-directions .overlay { position:absolute; --surface-opacity:.89; background:rgba(12,20,39,var(--surface-opacity)); padding:28px 30px 23px; }
#trophy-directions .eyebrow { margin:0; color:var(--soft); font-size:11px; letter-spacing:2.8px; line-height:1.4; text-transform:uppercase; }
#trophy-directions .heading { display:flex; align-items:baseline; justify-content:space-between; gap:18px; margin-bottom:22px; }
#trophy-directions .total { display:flex; align-items:baseline; gap:10px; white-space:nowrap; font-size:30px; letter-spacing:1px; line-height:1; }
#trophy-directions .total small { font-size:11px; letter-spacing:2px; color:var(--soft); }
#trophy-directions .trophies { display:grid; grid-template-columns:repeat(9,minmax(0,1fr)); gap:8px 6px; margin:0; }
#trophy-directions .mark { position:relative; display:grid; place-items:center; padding:0; border:0; background:none; color:var(--paint); height:40px; min-width:0; }
#trophy-directions .mark::before { content:""; width:100%; max-width:36px; height:36px; background:currentColor; mask-image:var(--ship); mask-size:contain; mask-position:center; mask-repeat:no-repeat; }
#trophy-directions .mark:hover { color:#fff; }
#trophy-directions .mark[aria-pressed="true"]::after { content:""; width:12px; height:1px; background:currentColor; position:absolute; bottom:-2px; }
#trophy-directions .selected { height:18px; font-size:11px; color:var(--soft); letter-spacing:1px; line-height:18px; margin-top:8px; }
#trophy-directions .trophy-progress { margin-top:12px; }
#trophy-directions .trophy-progress-label { color:var(--soft); font-size:11px; letter-spacing:1.4px; text-transform:uppercase; margin-bottom:12px; }
#trophy-directions .route { display:flex; align-items:center; gap:10px; }
#trophy-directions .node { flex-shrink:0; min-width:27px; height:27px; position:relative; display:grid; place-items:center; font-size:11px; letter-spacing:1px; color:var(--ink); }
#trophy-directions .node::before { content:""; position:absolute; inset:0; border:1px solid #dce3ed63; border-radius:50%; }
#trophy-directions .node.done::before { border-color:transparent; background:#a7bbcf20; }
#trophy-directions .node.current { color:#edba9d; }
#trophy-directions .node.current::before { border-color:#e2b69588; border-top-color:transparent; transform:rotate(-30deg); }
#trophy-directions .path { height:1px; flex:1; background:#c4d1e64a; }
#trophy-directions .footer { display:flex; align-items:center; justify-content:flex-end; margin-top:21px; }
#trophy-directions .continue { color:var(--ink); background:transparent; border:1px solid #e4e8ec80; padding:9px 17px; display:flex; align-items:center; gap:24px; font:400 11px/1.2 Bahnschrift,"Arial Narrow","Segoe UI",sans-serif; letter-spacing:2px; text-transform:uppercase; min-height:36px; }
#trophy-directions .continue:hover { background:#d8e1f111; border-color:#edf0ec; }
#trophy-directions .continue span { font-size:18px; line-height:12px; }
#trophy-directions .corner { position:absolute; width:16px; height:16px; border-color:#e9edf16e; border-style:solid; }
#trophy-directions .corner.tl { top:0; left:0; border-width:1px 0 0 1px; }
#trophy-directions .corner.br { bottom:0; right:0; border-width:0 1px 1px 0; }
#trophy-directions .glass .overlay { width:440px; left:50%; top:50%; transform:translate(-50%,-50%); }
#trophy-directions .glass .heading { padding-bottom:18px; border-bottom:1px solid var(--line); }
#trophy-directions .glass .trophy-progress { border-top:1px solid #d6dfed29; padding-top:17px; }
#trophy-directions .glass .footer { margin-top:22px; }
#trophy-directions .open .overlay { width:462px; left:50%; top:50%; transform:translate(-50%,-50%); padding:29px 30px; background:linear-gradient(90deg,#06102600,#081328b8 10%,#081328d9 50%,#081328b8 90%,#06102600); text-align:center; }
#trophy-directions .open .heading { flex-direction:column; align-items:center; gap:14px; margin-bottom:25px; }
#trophy-directions .open .total { font-size:22px; }
#trophy-directions .open .trophies { gap:12px 8px; }
#trophy-directions .open .selected { text-align:center; }
#trophy-directions .open .trophy-progress { margin-top:19px; padding:0 31px; }
#trophy-directions .open .footer { justify-content:center; margin-top:25px; }
#trophy-directions .open .continue { border-color:transparent; padding:8px 0; border-bottom:1px solid #e4e8ec65; }
#trophy-directions .strip .overlay { width:82%; max-width:842px; left:50%; bottom:42px; transform:translateX(-50%); padding:20px 27px; }
#trophy-directions .strip .heading { margin-bottom:15px; }
#trophy-directions .strip .total { font-size:23px; }
#trophy-directions .strip .trophies { grid-template-columns:repeat(17,minmax(0,1fr)); gap:4px; }
#trophy-directions .strip .mark { height:34px; }
#trophy-directions .strip .mark::before { height:31px; }
#trophy-directions .strip .selected { margin-top:3px; height:14px; line-height:14px; }
#trophy-directions .strip .lower { display:flex; gap:40px; align-items:flex-end; border-top:1px solid var(--line); padding-top:13px; margin-top:5px; }
#trophy-directions .strip .trophy-progress { flex:1; margin:0; display:flex; gap:23px; align-items:center; }
#trophy-directions .strip .trophy-progress-label { margin:0; flex-shrink:0; letter-spacing:1px; }
#trophy-directions .strip .route { flex:1; }
#trophy-directions .strip .footer { margin:0; }
#trophy-directions .rail .overlay { left:7%; top:50%; transform:translateY(-50%); width:308px; padding:27px; }
#trophy-directions .rail .heading { display:block; margin-bottom:23px; }
#trophy-directions .rail .total { margin-top:20px; font-size:30px; }
#trophy-directions .rail .trophies { grid-template-columns:repeat(5,minmax(0,1fr)); gap:7px; }
#trophy-directions .rail .trophy-progress { border-top:1px solid var(--line); padding-top:19px; margin-top:15px; }
#trophy-directions .rail .footer { justify-content:flex-start; margin-top:24px; }
#trophy-directions .chapters .overlay { left:50%; top:53%; transform:translate(-50%,-50%); width:540px; padding:25px 30px; }
#trophy-directions .chapters .heading { margin-bottom:27px; }
#trophy-directions .chapter-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:23px; }
#trophy-directions .chapter { min-width:0; }
#trophy-directions .chapter .trophies { grid-template-columns:repeat(3,minmax(0,1fr)); gap:4px; align-content:start; min-height:128px; }
#trophy-directions .chapter .mark { height:38px; }
#trophy-directions .chapter .mark::before { height:32px; }
#trophy-directions .chapter-label { display:flex; justify-content:space-between; align-items:center; padding-top:14px; margin-top:9px; border-top:1px solid var(--line); color:var(--soft); font-size:11px; letter-spacing:1px; }
#trophy-directions .chapter-label .sector-num { font-size:17px; color:var(--ink); }
#trophy-directions .chapter:last-child .chapter-label, #trophy-directions .chapter:last-child .sector-num { color:#edba9d; }
#trophy-directions .chapters .footer { justify-content:space-between; margin-top:16px; }
#trophy-directions .chapters .trophy-progress-label { margin:0; letter-spacing:1px; }
#trophy-directions .bands .overlay { width:446px; left:50%; top:50%; transform:translate(-50%,-50%); padding:0; background:none; }
#trophy-directions .bands .band { padding:21px 27px; background:rgba(12,20,39,var(--surface-opacity)); }
#trophy-directions .bands .heading { margin-bottom:19px; }
#trophy-directions .bands .total { font-size:23px; }
#trophy-directions .bands .selected { margin-bottom:-7px; }
#trophy-directions .bands .trophy-progress { display:flex; gap:22px; align-items:center; margin-top:8px; padding:17px 27px; background:rgba(12,20,39,var(--surface-opacity)); }
#trophy-directions .bands .trophy-progress-label { width:76px; flex-shrink:0; line-height:1.6; margin:0; letter-spacing:1px; }
#trophy-directions .bands .route { flex:1; }
#trophy-directions .bands .footer { margin-top:17px; }
#trophy-directions .bands .continue { background:#0d1833b3; }
@media(max-width:760px) {

 #trophy-directions .strip .lower { gap:20px; }
 #trophy-directions .strip .trophy-progress { display:block; }
 #trophy-directions .strip .trophy-progress-label { margin-bottom:8px; }
}
@media(max-width:560px) {

 #trophy-directions .trophies, #trophy-directions .strip .trophies { grid-template-columns:repeat(5,minmax(0,1fr)); gap:7px 2px; }
 #trophy-directions .mark, #trophy-directions .strip .mark { height:44px; }
 #trophy-directions .mark::before { height:34px; max-width:34px; }
 #trophy-directions .heading { margin-bottom:20px; }
 #trophy-directions .open .trophy-progress { padding:0 10px; }
 #trophy-directions .strip .lower { display:block; padding-top:15px; }
 #trophy-directions .strip .footer { margin-top:20px; }
 #trophy-directions .rail .heading { display:flex; align-items:baseline; }
 #trophy-directions .rail .total { margin-top:0; }
 #trophy-directions .chapters .overlay { padding:24px 16px; }
 #trophy-directions .chapter-grid { gap:12px; }
 #trophy-directions .chapter .trophies { grid-template-columns:repeat(2,minmax(0,1fr)); min-height:180px; gap:2px; }
 #trophy-directions .chapter .mark { height:43px; }
 #trophy-directions .chapter-label { display:block; line-height:1.8; }
 #trophy-directions .chapter-label .sector-num { display:block; }
 #trophy-directions .chapters .footer { align-items:flex-start; gap:12px; flex-direction:column; }
 #trophy-directions .bands .band { padding:24px 20px 19px; }
 #trophy-directions .bands .trophy-progress { padding:16px 20px; gap:14px; }
 #trophy-directions .continue { min-height:44px; }
}
</style>

<script>
(() => {
 const root = document.getElementById('trophy-directions');
 const textures = JSON.parse(document.getElementById('trophy-direction-assets').textContent);
 const kills = ['Valis','Crimson','Valis','Nightshade','Vanguard','Crimson','Valis','Bulwark','Nightshade','Valis','Vanguard','Crimson','Nightshade','Bulwark','Valis','Crimson','Vanguard'];
 const saved = window.openai?.widgetState?.modelContent;
 const selectedByDesign = saved?.selectedByDesign && typeof saved.selectedByDesign === 'object' ? {...saved.selectedByDesign} : {};
 function persist(design) {
  const result = window.openai?.setWidgetState?.({modelContent:{selectedByDesign, lastDesign:design},privateContent:null});
  result?.catch?.(() => {});
 }
 function select(game,index,save) {
  const marks = [...game.querySelectorAll('.mark')];
  marks.forEach(mark => mark.setAttribute('aria-pressed', String(Number(mark.dataset.index) === index)));
  game.querySelector('.selected').textContent = Number.isInteger(index) && kills[index] ? kills[index] : '';
  selectedByDesign[game.dataset.design] = index;
  if(save) persist(game.dataset.design);
 }
 root.querySelectorAll('.game').forEach(game => {
  const backdrop = game.querySelector('.space');
  for(let i=0;i<95;i++) {
   const star = document.createElement('i'); star.className='star';
   star.style.cssText=`left:${(i*67.31)%100}%;top:${(i*43.77)%100}%;width:${i%13===0?2:1}px;height:${i%13===0?2:1}px;opacity:${.2+(i%5)*.13}`;
   backdrop.append(star);
  }
  ['a','b','c','d'].forEach(name => {const rock=document.createElement('i');rock.className=`rock ${name}`;backdrop.append(rock);});
  const sceneShip=document.createElement('i');sceneShip.className='scene-ship';sceneShip.style.maskImage=`url("${textures.Valis}")`;backdrop.append(sceneShip);
  game.querySelectorAll('.trophies').forEach(grid => {
   const range=grid.dataset.kills==='all'?[0,kills.length]:grid.dataset.kills.split(':').map(Number);
   for(let index=range[0];index<range[1];index++) {
    const name=kills[index];const mark=document.createElement('button');mark.type='button';mark.className='mark cursor-interaction';
    mark.dataset.index=String(index);mark.setAttribute('aria-label',`${name}, trophy ${index+1}`);mark.setAttribute('aria-pressed','false');
    mark.style.setProperty('--ship',`url("${textures[name]}")`);mark.addEventListener('click',()=>select(game,index,true));grid.append(mark);
   }
  });
  game.querySelectorAll('.route').forEach(route => {
   ['01','02','03'].forEach((num,index)=>{
    if(index){const path=document.createElement('span');path.className='path';path.setAttribute('aria-hidden','true');route.append(path);}
    const node=document.createElement('span');node.className=`node ${index<2?'done':'current'}`;node.textContent=num;node.setAttribute('aria-label',`Sector ${num}, ${index<2?'cleared':'reached'}`);route.append(node);
   });
  });
  game.querySelector('.continue').addEventListener('click',()=>{
   game.querySelector('.selected').textContent='Returns to the hangar';
  });
  if(Number.isInteger(selectedByDesign[game.dataset.design]))select(game,selectedByDesign[game.dataset.design],false);
  if(globalThis.Tweak){
   const state={backing:89,paint:'#e8e7d9'};const panel=game.querySelector('.overlay');
   const tweak=new Tweak({container:panel,onChange:()=>{panel.style.setProperty('--surface-opacity',String(state.backing/100));game.style.setProperty('--paint',state.paint);}});
   if(!game.classList.contains('open'))tweak.addSlider(state,'backing',{label:'Backing opacity',min:55,max:100,step:1,unit:'%'});
   tweak.addColorPicker(state,'paint',{label:'Silhouette paint',reference:'--paint'});
  }
 });
 window.addEventListener('openai:set_globals',event=>{
  const restored=event.detail?.globals?.widgetState?.modelContent?.selectedByDesign;
  if(!restored)return;
  root.querySelectorAll('.game').forEach(game=>select(game,Number.isInteger(restored[game.dataset.design])?restored[game.dataset.design]:-1,false));
 });
})();
</script>
